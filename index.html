function calcRecon() {
  const mg  = parseFloat(document.getElementById('rVialMg').value);
  const ml  = parseFloat(document.getElementById('rDilMl').value);
  const res = document.getElementById('rResult');
  const drawRes = document.getElementById('rDrawResult');
  if (!mg || !ml || isNaN(mg) || isNaN(ml)) { res.style.display='none'; drawRes.style.display='none'; return; }
  const totalMcg  = mg * 1000;
  const concMcgMl = totalMcg / ml;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Concentration</div><div style="font-weight:700;">${concMcgMl.toFixed(0)} mcg/mL</div></div>
      <div><div class="muted" style="font-size:11px;">Total Amount</div><div style="font-weight:700;">${totalMcg.toFixed(0)} mcg</div></div>
    </div>`;
  const doseMcg = parseFloat(document.getElementById('rDoseMcg').value);
  if (!doseMcg || isNaN(doseMcg)) { drawRes.style.display='none'; return; }
  const volMl = doseMcg / concMcgMl;
  const iu    = volMl * _syringeType;
  drawRes.style.display = 'block';
  drawRes.innerHTML = `Draw <strong>${volMl.toFixed(3)} mL</strong> (${iu.toFixed(1)} units on U-${_syringeType} syringe) for a ${doseMcg} mcg dose${syringeOverflowWarning(volMl)}`;
}

function calcTRT() {
  const conc   = parseFloat(document.getElementById('tConc').value);
  const dose   = parseFloat(document.getElementById('tWeekly').value);
  const per    = document.getElementById('tDosePer').value;
  const freq   = parseFloat(document.getElementById('tFreq').value);
  const vialMl = parseFloat(document.getElementById('tVialMl').value);
  const res    = document.getElementById('tResult');
  if (!res) return;
  if (!conc || !dose || !freq || isNaN(conc) || isNaN(dose) || isNaN(freq)) { res.style.display = 'none'; return; }
  const weekly = per === 'day' ? dose * 7 : dose;
  const perInjMg  = weekly / freq;
  const perInjMl  = perInjMg / conc;
  const iu        = perInjMl * _syringeType;
  const weeklyMl  = weekly / conc;
  const vialWeeks = vialMl > 0 ? vialMl / weeklyMl : 0;
  const vialInj   = vialMl > 0 ? vialMl / perInjMl : 0;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Per Injection</div><div style="font-weight:700;">${parseFloat(perInjMg.toPrecision(4))} mg</div></div>
      <div><div class="muted" style="font-size:11px;">Draw Volume</div><div style="font-weight:700;color:var(--accent-sky);">${perInjMl.toFixed(3)} mL (${iu.toFixed(1)} units on U-${_syringeType})</div></div>
      <div><div class="muted" style="font-size:11px;">Weekly Total</div><div style="font-weight:700;">${parseFloat(weekly.toPrecision(4))} mg (${weeklyMl.toFixed(3)} mL)</div></div>
      <div><div class="muted" style="font-size:11px;">${vialMl || 0} mL Vial Lasts</div><div style="font-weight:700;color:var(--accent-indigo);">${vialWeeks ? `~${vialWeeks.toFixed(1)} weeks (${Math.floor(vialInj)} injections)` : '—'}</div></div>
    </div>
    ${syringeOverflowWarning(perInjMl)}`;
}

function calcHCG() {
  const vialIU = parseFloat(document.getElementById('hVialIU').value);
  const bacMl  = parseFloat(document.getElementById('hBacMl').value);
  const doseIU = parseFloat(document.getElementById('hDoseIU').value);
  const res    = document.getElementById('hResult');
  if (!res) return;
  if (!vialIU || !bacMl || isNaN(vialIU) || isNaN(bacMl)) { res.style.display = 'none'; return; }
  const concIUml = vialIU / bacMl;
  res.style.display = 'block';
  let doseHtml = '<p class="muted" style="margin-top:8px;">Enter a desired dose to get the draw amount.</p>';
  if (doseIU && !isNaN(doseIU)) {
    const volMl = doseIU / concIUml;
    const syrUnits = volMl * _syringeType;
    const dosesPerVial = vialIU / doseIU;
    doseHtml = `
      <hr class="divider" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><div class="muted" style="font-size:11px;">Draw Volume</div><div style="font-weight:700;color:var(--accent-sky);">${volMl.toFixed(3)} mL</div></div>
        <div><div class="muted" style="font-size:11px;">Syringe Reading</div><div style="font-weight:700;color:var(--accent-indigo);">${syrUnits.toFixed(1)} units on U-${_syringeType}</div></div>
        <div><div class="muted" style="font-size:11px;">Dose</div><div style="font-weight:700;">${parseFloat(doseIU.toPrecision(6))} IU HCG</div></div>
        <div><div class="muted" style="font-size:11px;">Doses per Vial</div><div style="font-weight:700;">${dosesPerVial.toFixed(1)}</div></div>
      </div>
      ${syringeOverflowWarning(volMl)}`;
  }
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Concentration</div><div style="font-weight:700;">${concIUml.toFixed(0)} IU/mL</div></div>
      <div><div class="muted" style="font-size:11px;">Total in Vial</div><div style="font-weight:700;">${parseFloat(vialIU.toPrecision(6))} IU</div></div>
    </div>
    ${doseHtml}`;
}

function calcNasal() {
  const mg      = parseFloat(document.getElementById('nMg').value);
  const volMl   = parseFloat(document.getElementById('nVolMl').value);
  const sprayMl = parseFloat(document.getElementById('nSprayMl').value);
  const doseMcg = parseFloat(document.getElementById('nDoseMcg').value);
  const res     = document.getElementById('nResult');
  if (!res) return;
  if (!mg || !volMl || !sprayMl || isNaN(mg) || isNaN(volMl) || isNaN(sprayMl)) { res.style.display = 'none'; return; }
  const concMcgMl   = (mg * 1000) / volMl;
  const mcgPerSpray = concMcgMl * sprayMl;
  const totalSprays = volMl / sprayMl;
  let doseHtml = '';
  if (doseMcg && !isNaN(doseMcg)) {
    const sprays = doseMcg / mcgPerSpray;
    const rounded = Math.round(sprays);
    const actualMcg = rounded * mcgPerSpray;
    doseHtml = `
      <hr class="divider" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><div class="muted" style="font-size:11px;">Sprays for ${parseFloat(doseMcg.toPrecision(6))} mcg</div><div style="font-weight:700;color:var(--accent-indigo);">${parseFloat(sprays.toPrecision(3))} sprays</div></div>
        <div><div class="muted" style="font-size:11px;">Rounded: ${rounded} spray${rounded === 1 ? '' : 's'}</div><div style="font-weight:700;">= ${actualMcg.toFixed(0)} mcg actual</div></div>
      </div>
      <div class="muted" style="margin-top:8px;font-size:12px;">${Math.floor(totalSprays / Math.max(rounded, 1))} doses per bottle at ${rounded} spray${rounded === 1 ? '' : 's'} each</div>`;
  }
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Concentration</div><div style="font-weight:700;">${concMcgMl.toFixed(0)} mcg/mL</div></div>
      <div><div class="muted" style="font-size:11px;">Per Spray</div><div style="font-weight:700;color:var(--accent-sky);">${mcgPerSpray.toFixed(0)} mcg</div></div>
      <div><div class="muted" style="font-size:11px;">Total Sprays</div><div style="font-weight:700;">~${Math.floor(totalSprays)}</div></div>
      <div><div class="muted" style="font-size:11px;">Total Peptide</div><div style="font-weight:700;">${parseFloat(mg.toPrecision(6))} mg</div></div>
    </div>
    ${doseHtml}`;
}

function convertMass(src) {
  const mcgEl = document.getElementById('cvMcg');
  const mgEl  = document.getElementById('cvMg');
  if (src === 'mcg') {
    const v = parseFloat(mcgEl.value);
    mgEl.value = isNaN(v) ? '' : parseFloat((v / 1000).toPrecision(10));
  } else {
    const v = parseFloat(mgEl.value);
    mcgEl.value = isNaN(v) ? '' : parseFloat((v * 1000).toPrecision(10));
  }
}

function calcCustomRecon() {
  const mg      = parseFloat(document.getElementById('crVialMg').value);
  const doseMcg = parseFloat(document.getElementById('crDoseMcg').value);
  const units   = parseFloat(document.getElementById('crUnits').value);
  const res     = document.getElementById('crResult');
  if (!res) return;
  if (!mg || !doseMcg || !units || isNaN(mg) || isNaN(doseMcg) || isNaN(units)) { res.style.display = 'none'; return; }
  const volMl      = units / _syringeType;        // volume one dose occupies at the target reading
  const conc       = doseMcg / volMl;             // required concentration, mcg/mL
  const diluentMl  = (mg * 1000) / conc;          // diluent that produces that concentration
  const dosesPerVial = (mg * 1000) / doseMcg;
  const bigVialNote = diluentMl > 3
    ? '<p class="muted" style="margin-top:8px;">⚠️ Needs over 3 mL of diluent — make sure your vial holds it, or raise the target units.</p>' : '';
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Add Diluent</div><div style="font-weight:700;color:var(--accent-sky);">${diluentMl.toFixed(2)} mL</div></div>

function calcDraw() {
  const conc = parseFloat(document.getElementById('dConc').value);
  let   dose = parseFloat(document.getElementById('dDose').value);
  const unit = document.getElementById('dUnit').value;
  const res  = document.getElementById('dResult');
  if (!conc || !dose || isNaN(conc) || isNaN(dose)) { res.style.display='none'; return; }
  if (unit === 'mg') dose *= 1000;
  const volMl = dose / conc;
  const iu    = volMl * _syringeType;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Draw Volume</div><div style="font-weight:700;color:var(--accent-sky);">${volMl.toFixed(3)} mL</div></div>
      <div><div class="muted" style="font-size:11px;">U-${_syringeType} Units</div><div style="font-weight:700;color:var(--accent-indigo);">${iu.toFixed(1)} units</div></div>
    </div>
    ${syringeOverflowWarning(volMl)}`;
}

function calcCost() {
  const dose  = parseFloat(document.getElementById('cDose').value);
  const freq  = parseFloat(document.getElementById('cFreq').value);
  const weeks = parseFloat(document.getElementById('cWeeks').value);
  const price = parseFloat(document.getElementById('cPrice').value);
  const res   = document.getElementById('cResult');
  if (!dose||!freq||!weeks||!price||isNaN(dose)||isNaN(freq)||isNaN(weeks)||isNaN(price)) { res.style.display='none'; return; }
  const totalInj  = Math.ceil(freq * weeks);
  const totalMcg  = dose * totalInj;
  const totalMg   = totalMcg / 1000;
  const vialsNeeded = Math.ceil(totalMg / 10);
  const cost      = totalMg * price;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Total Injections</div><div style="font-weight:700;">${totalInj}</div></div>
      <div><div class="muted" style="font-size:11px;">Total Amount</div><div style="font-weight:700;">${totalMg.toFixed(2)} mg (${totalMcg.toFixed(0)} mcg)</div></div>
      <div><div class="muted" style="font-size:11px;">Vials Needed (10mg)</div><div style="font-weight:700;">${vialsNeeded}</div></div>
      <div><div class="muted" style="font-size:11px;">Estimated Cost</div><div style="font-weight:700;color:var(--accent-sky);">$${cost.toFixed(2)}</div></div>
    </div>`;
}

function hlFromPeptide() {
  const sel  = document.getElementById('hlPeptide');
  const name = sel.value;
  const hlNotesEl = document.getElementById('hlNotes');
  if (!name || !PEPTIDE_HALFLIFE[name]) { hlNotesEl.style.display='none'; document.getElementById('hlHours').value=''; return; }
  const data = PEPTIDE_HALFLIFE[name];
  document.getElementById('hlHours').value = data.halfLife;
  hlNotesEl.style.display = 'block';
  hlNotesEl.textContent = data.notes;

function calcHL() {
  const hours = parseFloat(document.getElementById('hlHours').value);
  const res   = document.getElementById('hlResult');
  if (!hours || isNaN(hours) || hours <= 0) { res.style.display='none'; return; }
  const t50  = hours;
  const t25  = hours * 2;
  const t125 = hours * 3;
  function fmt(h) {
    if (h < 1) return `${(h*60).toFixed(0)} min`;
    if (h < 24) return `${h.toFixed(1)} hr`;
    return `${(h/24).toFixed(1)} days`;
  }
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">50% remaining</div><div style="font-weight:700;color:var(--accent-green);">${fmt(t50)}</div></div>
      <div><div class="muted" style="font-size:11px;">25% remaining</div><div style="font-weight:700;color:var(--accent-amber);">${fmt(t25)}</div></div>
      <div><div class="muted" style="font-size:11px;">12.5% remaining</div><div style="font-weight:700;color:#ef4444;">${fmt(t125)}</div></div>
    </div>`;
}

// "10 mg vial + X mL BW" line targeting a typical dose ≈ 10 units on a U-100.
// Only rendered when the library doseRange parses to a clean mg/mcg number.
function suggestedRecipeHtml(p) {
  const m = (p.doseRange || '').match(/([\d.]+)\s*(?:[\u2013-]\s*([\d.]+))?\s*(mcg|mg)/i);
  if (!m) return '';
  const lo = parseFloat(m[1]), hi = m[2] ? parseFloat(m[2]) : lo;
  const unit = m[3].toLowerCase();
  const doseMg = ((lo + hi) / 2) * (unit === 'mcg' ? 0.001 : 1);
  if (!doseMg || !isFinite(doseMg)) return '';
  const conc = doseMg / 0.1; // mg/mL that puts the dose at 0.10 mL (10 units)
  const vial = [5, 10, 15, 30].find(v => v / conc >= 0.5 && v / conc <= 3);
  if (!vial) return '';
  const water = Math.round((vial / conc) * 10) / 10;
  const units = Math.round((doseMg / (vial / water)) * 100);
  const doseDisp = unit === 'mcg' ? `${Math.round(doseMg * 1000)} mcg` : `${parseFloat(doseMg.toFixed(2))} mg`;
  return `
    <div>
      <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:4px;">Suggested recipe</p>
      <p style="font-size:13px;line-height:1.55;">${vial} mg vial + ${water} mL bacteriostatic water → a typical ${doseDisp} dose ≈ ${units} units on a U-100 syringe. Step-by-step: Calculator → Protocols.</p>
    </div>`;
}

function cycleTheme() {
  const cur = App.getData().settings?.theme || 'system';
  const next = cur === 'light' ? 'dark' : cur === 'dark' ? 'system' : 'light';
  setTheme(next);
}

async function addPeptide() {
  const input = document.getElementById('newPeptideInput');
  const name  = input.value.trim();
  if (!name) { alert('Please enter a peptide name.'); return; }
  try {
    await API.post('/peptides', { name });
    input.value = '';
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to add peptide: ' + (e.message || 'Unknown error'));
  }
}

async function removePeptide(id, name) {
  const { planner, logs, vials } = App.getData();
  const inUse =
    planner.some(p => p.peptide === name) ||
    logs.some(l => l.peptide === name) ||
    vials.some(v => v.peptide === name);
  if (inUse) {
    alert(`"${name}" is used in your planner, logs, or vials. Remove those entries first.`);
    return;
  }
  try {
    await API.delete('/peptides/' + id);
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to remove peptide: ' + (e.message || 'Unknown error'));
  }
}

async function resetPeptides() {
  if (!confirm('This will add any missing default peptides and remove unused non-default peptides. Continue?')) return;
  const { peptides, planner, logs, vials } = App.getData();
  const existingNames = peptides.map(p => p.name);
  const toAdd = DEFAULT_PEPTIDES.filter(n => !existingNames.includes(n));
  const toRemove = peptides.filter(p => {
    if (DEFAULT_PEPTIDES.includes(p.name)) return false;
    const inUse =
      planner.some(pl => pl.peptide === p.name) ||
      logs.some(l => l.peptide === p.name) ||
      vials.some(v => v.peptide === p.name);
    return !inUse;
  });
  try {
    await Promise.all(toAdd.map(n => API.post('/peptides', { name: n })));
    await Promise.all(toRemove.map(p => API.delete('/peptides/' + p.id)));
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Reset error: ' + (e.message || 'Unknown error'));
  }
}

function exportCSV() {
  const { planner, vials, logs, settings } = App.getData();

  const esc = (s) => {
    s = String(s ?? '');
    return (s.includes(',') || s.includes('"') || s.includes('\n'))
      ? `"${s.replaceAll('"', '""')}"` : s;
  };
  const toCsv = (rows) => {
    if (!rows.length) return '(none)';
    const keys = Object.keys(rows[0]);
    return [keys.join(','), ...rows.map(r => keys.map(k => esc(r[k])).join(','))].join('\n');
  };

  const plannerRows = planner.map(p => ({
    day: DAYS[p.day], time: p.time || '', peptide: p.peptide,
    route: p.route, dose: p.dose, unit: p.unit, note: p.note || ''
  }));

  const content = [
    `# CYCLE`,
    `cycle_start,cycle_end`,
    `${esc(settings.cycle_start || '')},${esc(settings.cycle_end || '')}`,
    '',
    `# PLANNER`,
    toCsv(plannerRows),
    '',
    `# VIALS`,
    toCsv(vials),
    '',
    `# LOGS`,
    toCsv(logs)
  ].join('\n');

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'peptideos_export.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

async function deleteAllData() {
  if (!confirm('Are you sure? This will permanently delete ALL your data including logs, vials, planner, and account.')) return;
  if (!confirm('This is irreversible. Type OK in the next prompt to confirm.')) return;
  const ok = prompt('Type DELETE to confirm permanent deletion:');
  if (ok !== 'DELETE') return;
  try {
    await API.delete('/account');
    await App.logout();
    showAuth('login');
  } catch (e) {
    alert('Failed: ' + (e.message || 'Unknown error'));
  }
}

function showChangePassword() {
  const overlay = document.createElement('div');
  overlay.id = 'pwOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;';
  overlay.innerHTML = `
    <div class="glass" style="max-width:400px;width:100%;padding:28px;">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">Change Password</h3>
      <div class="stack">
        <label>Current Password<input type="password" id="cpCurrentPass" autocomplete="current-password" placeholder="Current password" /></label>
        <label>New Password<input type="password" id="pwNew" autocomplete="new-password" placeholder="Min 8 characters" /></label>
        <label>Confirm New Password<input type="password" id="pwConfirm" autocomplete="new-password" placeholder="Repeat password" /></label>
        <div id="pwErr" class="auth-error"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" style="flex:1;" onclick="submitChangePassword()">Update Password</button>
          <button class="btn btn-ghost" onclick="document.getElementById('pwOverlay').remove()">Cancel</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function submitChangePassword() {
  const currentPass = document.getElementById('cpCurrentPass').value;
  const pass        = document.getElementById('pwNew').value;
  const confirm     = document.getElementById('pwConfirm').value;
  const errEl       = document.getElementById('pwErr');
  errEl.textContent = '';
  if (!currentPass)     { errEl.textContent = 'Current password is required.'; return; }
  if (pass.length < 8)  { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm)  { errEl.textContent = 'Passwords do not match.'; return; }
  try {
    await API.post('/auth/change-password', { current_password: currentPass, password: pass });
    document.getElementById('pwOverlay').remove();
    alert('Password updated successfully.');
  } catch (e) {
    errEl.textContent = e.message || 'Failed to update password.';
  }
}

function updatePushButtonState() {
  const btn    = document.getElementById('pushBtn');
  const status = document.getElementById('pushStatus');
  if (!btn || !status) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    btn.textContent = 'Not Supported';
    btn.disabled = true;
    status.textContent = 'Push notifications are not supported in this browser.';
    return;
  }
  const perm = Notification.permission;
  if (perm === 'denied') {
    btn.textContent = 'Blocked';
    btn.disabled = true;
    status.textContent = 'Notifications blocked in browser settings.';
  } else if (perm === 'granted') {
    btn.textContent = 'Disable Notifications';
    status.textContent = 'Push notifications are enabled.';
  } else {
    btn.textContent = 'Enable Notifications';
    status.textContent = 'Notifications not yet enabled.';
  }
}

function urlBase64ToUint8Array(b64) {
  const padded = b64.replace(/-/g, '+').replace(/_/g, '/');
  const padding = (4 - padded.length % 4) % 4;
  const raw = atob(padded + '='.repeat(padding));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function togglePush() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      await existing.unsubscribe();
      await API.delete('/push/subscribe', { endpoint: existing.endpoint });
      updatePushButtonState();
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { updatePushButtonState(); return; }
    const { publicKey } = await API.get('/push/vapid-key');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    const json = sub.toJSON();
    await API.post('/push/subscribe', {
      endpoint: json.endpoint,
      keys: { p256dh: json.keys.p256dh, auth: json.keys.auth }
    });
    updatePushButtonState();
  } catch (e) {
    alert('Push setup failed: ' + (e.message || 'Unknown error'));
    updatePushButtonState();
  }
}

// ── Utility ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').then(reg => {
    window.addEventListener('online', () => reg.sync?.register('flush-queue').catch(() => {}));
  }).catch(err => console.warn('SW registration failed:', err));
}
