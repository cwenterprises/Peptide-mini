<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PeptideOS</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PeptideOS">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8f4fd;
      --grad1: rgba(56,189,248,0.22);
      --grad2: rgba(99,102,241,0.16);
      --grad3: rgba(34,211,238,0.14);
      --text: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.85);
      --glass-shadow: 0 8px 32px rgba(14,30,60,0.10), 0 2px 8px rgba(14,30,60,0.07), inset 0 1px 0 rgba(255,255,255,0.95);
      --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.9) 40%, rgba(255,255,255,1) 60%, transparent);
      --chip-bg: rgba(255,255,255,0.65);
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(148,163,184,0.5);
      --accent-sky: #0ea5e9;
      --accent-indigo: #6366f1;
      --accent-green: #16a34a;
      --accent-amber: #d97706;
      --btn-grad: linear-gradient(135deg, #0ea5e9, #6366f1);
      --btn-glow: 0 4px 16px rgba(99,102,241,0.35);
      --radius-card: 18px;
      --radius-btn: 12px;
      --radius-input: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1e;
        --grad1: rgba(56,189,248,0.10);
        --grad2: rgba(99,102,241,0.10);
        --grad3: rgba(34,211,238,0.06);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --glass-bg: rgba(255,255,255,0.06);
        --glass-border: rgba(255,255,255,0.12);
        --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
        --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.12) 60%, transparent);
        --chip-bg: rgba(255,255,255,0.08);
        --input-bg: rgba(255,255,255,0.05);
        --input-border: rgba(255,255,255,0.12);
        --accent-green: #4ade80;
        --accent-amber: #fbbf24;
      }
    }

    body[data-theme="dark"] {
      --bg: #0a0f1e;
      --grad1: rgba(56,189,248,0.10);
      --grad2: rgba(99,102,241,0.10);
      --grad3: rgba(34,211,238,0.06);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
      --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.12) 60%, transparent);
      --chip-bg: rgba(255,255,255,0.08);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.12);
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
    }

    body[data-theme="light"] {
      --bg: #e8f4fd;
      --grad1: rgba(56,189,248,0.22);
      --grad2: rgba(99,102,241,0.16);
      --grad3: rgba(34,211,238,0.14);
      --text: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.85);
      --glass-shadow: 0 8px 32px rgba(14,30,60,0.10), 0 2px 8px rgba(14,30,60,0.07), inset 0 1px 0 rgba(255,255,255,0.95);
      --chip-bg: rgba(255,255,255,0.65);
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(148,163,184,0.5);
      --accent-green: #16a34a;
      --accent-amber: #d97706;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse at 15% 10%, var(--grad1) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 80%, var(--grad2) 0%, transparent 45%),
        radial-gradient(ellipse at 55% 5%,  var(--grad3) 0%, transparent 35%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* Glass card */
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: var(--glass-shimmer);
      pointer-events: none;
      z-index: 1;
    }

    /* Nav pill */
    .nav-pill {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: var(--chip-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(14,30,60,0.09), inset 0 1px 0 rgba(255,255,255,0.8);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-pill::-webkit-scrollbar { display: none; }
    .nav-tab {
      flex: 1;
      min-width: 64px;
      text-align: center;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .nav-tab.active {
      background: var(--glass-bg);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(14,30,60,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
    }
    /* Edge fades hinting the nav pill scrolls horizontally (mobile) */
    .nav-fade {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 34px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .nav-fade-l {
      left: 1px;
      border-radius: 14px 0 0 14px;
      background: linear-gradient(to right, var(--bg), transparent);
    }
    .nav-fade-r {
      right: 1px;
      border-radius: 0 14px 14px 0;
      background: linear-gradient(to left, var(--bg), transparent);
    }
    .nav-fade.visible { opacity: 0.9; }

    /* Buttons */
    .btn {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-btn);
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--btn-grad);
      color: white;
      box-shadow: var(--btn-glow);
    }
    .btn-ghost {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
    }
    .btn-danger {
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-sm { font-size: 12px; padding: 6px 12px; }

    /* Inputs */
    input, select, textarea {
      font-family: var(--font);
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      width: 100%;
      transition: border-color 0.15s;
      backdrop-filter: blur(8px);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-sky);
      box-shadow: 0 0 0 2px rgba(14,165,233,0.18);
    }
    textarea { min-height: 60px; resize: vertical; }
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Status badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge-done    { background: rgba(22,163,74,0.15);  color: var(--accent-green); border: 1px solid rgba(22,163,74,0.3); }
    .badge-pending { background: rgba(217,119,6,0.12);  color: var(--accent-amber); border: 1px solid rgba(217,119,6,0.3); }
    .badge-info    { background: rgba(14,165,233,0.12); color: var(--accent-sky);   border: 1px solid rgba(14,165,233,0.3); }

    /* Chip */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--chip-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(8px);
    }

    /* Layout helpers */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .muted { color: var(--text-muted); font-size: 12px; }
    .divider { border: none; border-top: 1px solid var(--glass-border); margin: 8px 0; }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: var(--input-border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--btn-grad);
      transition: width 0.4s ease;
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--input-border); }
    th { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .text-right { text-align: right; }

    /* App shell */
    #app { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Auth screens */
    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card { width: 100%; max-width: 400px; padding: 32px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--btn-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-error { color: #ef4444; font-size: 13px; min-height: 18px; }

    /* Dose row */
    .dose-row {
      padding: 12px;
      border-radius: 12px;
      background: var(--chip-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dose-row-info { flex: 1; min-width: 0; }
    .dose-row-name { font-weight: 600; font-size: 14px; }
    .dose-row-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

    /* Vial progress bar */
    .vial-bar  { height: 6px; border-radius: 999px; background: var(--input-border); overflow: hidden; margin-top: 6px; }
    .vial-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

    /* Disclaimer */
    .disclaimer { font-size: 11px; color: var(--text-muted); padding: 10px 14px; text-align: center; opacity: 0.8; }

    /* Application site body diagrams */
    /* Peptide info button + bottom sheet */
    .theme-fab {
      position: fixed; right: 14px; bottom: 14px; z-index: 900;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--chip-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .pep-info { background: none; border: none; cursor: pointer; color: var(--accent-sky); font-size: 13px; padding: 0 3px; line-height: 1; vertical-align: baseline; }
    .pep-sheet { animation: pepSheetUp 0.25s ease; }
    @keyframes pepSheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    .site-figure { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
    .site-figure-caption { font-size: 11px; color: var(--text-muted); }
    .site-pulse { animation: sitePulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes sitePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(1.35); }
    }

    @media (max-width: 640px) {
      .row2, .row3 { grid-template-columns: 1fr; }
      .app-title { font-size: 18px; }
    }
  </style>
</head>

  <script>
// Version check — bust stale CDN cache; never interferes with /reset token links
(function(){
  const APP_VERSION = 'v20260801-vialreset';
  // Skip entirely on /reset so token query param is never dropped
  if (location.pathname === '/reset') return;
  const stored = sessionStorage.getItem('app_version');
  if (stored !== APP_VERSION) {
    sessionStorage.setItem('app_version', APP_VERSION);
    if (!location.search.includes('_v=')) {
      // Preserve any existing query params, append _v
      const sep = location.search ? '&' : '?';
      location.replace(location.pathname + location.search + sep + '_v=' + APP_VERSION);
    }
  }
})();
  </script>
  <script>
// ── API Client ──────────────────────────────────────────────────────────────
const API = (() => {
  const BASE = '/api';
  const getToken = () => localStorage.getItem('peptideos_token');
  const setToken = (t) => localStorage.setItem('peptideos_token', t);
  const clearToken = () => localStorage.removeItem('peptideos_token');

  async function req(method, path, body) {
    const token = getToken();
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
    return data;
  }

  return {
    get:    (path)       => req('GET',    path),
    post:   (path, body) => req('POST',   path, body),
    put:    (path, body) => req('PUT',    path, body),
    delete: (path, body) => req('DELETE', path, body),
    setToken, clearToken, getToken
  };
})();

// ── App State ────────────────────────────────────────────────────────────────
const App = (() => {
  let _token = API.getToken();
  let _email = localStorage.getItem('peptideos_email') || '';
  let _theme = localStorage.getItem('peptideos_theme') || 'system';
  let _data  = { peptides: [], planner: [], vials: [], logs: [], settings: {}, vendors: [], prices: [], orders: [], cycles: [] };

  function applyTheme(t) {
    _theme = t;
    localStorage.setItem('peptideos_theme', t);
    if (t === 'system') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', t);
  }

  function isLoggedIn() { return !!_token; }

  async function login(email, password) {
    const { token } = await API.post('/auth/login', { email, password });
    _token = token; _email = email;
    API.setToken(token);
    localStorage.setItem('peptideos_email', email);
  }

  async function register(email, password) {
    const { token } = await API.post('/auth/register', { email, password });
    _token = token; _email = email;
    API.setToken(token);
    localStorage.setItem('peptideos_email', email);
  }

  async function logout() {
    await API.post('/auth/logout').catch(() => {});
    API.clearToken();
    localStorage.removeItem('peptideos_email');
    _token = null; _email = '';
    _data = { peptides: [], planner: [], vials: [], logs: [], settings: {}, vendors: [], prices: [], orders: [], cycles: [], inventory: [] };
  }

  async function loadAll() {
    let [peptides, planner, vials, logs, settings, vendors, prices, orders, cycles, inventory] = await Promise.all([
      API.get('/peptides'),
      API.get('/planner'),
      API.get('/vials'),
      API.get('/logs'),
      API.get('/settings'),
      API.get('/vendors'),
      API.get('/prices'),
      API.get('/orders'),
      API.get('/cycles').catch(() => []),
      API.get('/inventory').catch(() => [])
    ]);
    if (!peptides.length) {
      await Promise.all(DEFAULT_PEPTIDES.map(name => API.post('/peptides', { name }).catch(() => {})));
      peptides = await API.get('/peptides');
    }
    _data = { peptides, planner, vials, logs, settings, vendors, prices, orders, cycles, inventory };
    applyTheme(settings.theme || 'system');
    return _data;
  }

  return {
    isLoggedIn, login, register, logout, loadAll, applyTheme,
    getData:  () => _data,
    getEmail: () => _email,
    getTheme: () => _theme
  };
})();

// ── Tab Navigation ───────────────────────────────────────────────────────────
const Tabs = (() => {
  let current = 'dashboard';

  document.getElementById('navPill').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    switchTo(btn.dataset.tab);
  });

  function switchTo(tabId) {
    current = tabId;
    document.querySelectorAll('.nav-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tabId)
    );
    document.querySelectorAll('.tab-content').forEach(c =>
      c.classList.toggle('active', c.id === tabId)
    );
  }

  // Show edge fades only when the pill overflows and isn't at that edge
  const pill = document.getElementById('navPill');
  const fadeL = document.querySelector('.nav-fade-l');
  const fadeR = document.querySelector('.nav-fade-r');
  function updateNavFades() {
    const overflow = pill.scrollWidth - pill.clientWidth;
    fadeL.classList.toggle('visible', overflow > 4 && pill.scrollLeft > 4);
    fadeR.classList.toggle('visible', overflow > 4 && pill.scrollLeft < overflow - 4);
  }
  pill.addEventListener('scroll', updateNavFades, { passive: true });
  window.addEventListener('resize', updateNavFades);
  updateNavFades();

  return { switchTo, current: () => current, updateNavFades };
})();

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function boot() {
  const storedTheme = localStorage.getItem('peptideos_theme') || 'system';
  if (storedTheme !== 'system') document.body.setAttribute('data-theme', storedTheme);

  if (window.location.pathname === '/reset') {
    document.getElementById('authScreen').style.display = 'flex';
    renderAuth('reset');
    return;
  }

  if (App.isLoggedIn()) {
    try {
      await App.loadAll();
      showApp();
    } catch (e) {
      if (e.status === 401) { API.clearToken(); showAuth('login'); }
      else showApp();
    }
  } else {
    showAuth('login');
  }
})();

function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  renderAllTabs();
  Tabs.updateNavFades();
}

function showAuth(mode) {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  renderAuth(mode);
}

function renderAllTabs() {
  updateThemeFab(App.getData().settings?.theme || 'system');
  renderDashboard();
  renderToday();
  renderWeek();
  renderLogDose();

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function pad2(n) { return String(n).padStart(2, '0'); }

function ymd(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

// Local calendar day of a stored UTC timestamp. NEVER slice(0,10) an ISO
// string for day math — that's the UTC day, which rolls over at 8pm EDT and
// buckets evening doses onto the next local day.
function takenYmd(takenAt) {
  return takenAt ? ymd(new Date(takenAt)) : '';
}

function planMatched(plan, logs) {
  return logs.some(l => {
    if (l.peptide !== plan.peptide) return false;
    if (l.route   !== plan.route)   return false;
    if (l.dose_unit !== plan.unit)  return false;
    const ratio = Math.abs(parseFloat(l.dose_value) - parseFloat(plan.dose)) / (parseFloat(plan.dose) || 1);
    return ratio <= 0.02;
  });
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPass').value;
  const err   = document.getElementById('authErr');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Email and password are required.'; return; }
  try {
    await App.login(email, pass);
    await App.loadAll();
    showApp();
    renderAllTabs();
  } catch (e) {
    err.textContent = e.message || 'Login failed. Check credentials and try again.';
  }
}

async function doRegister() {
  const email   = document.getElementById('authEmail').value.trim();
  const pass    = document.getElementById('authPass').value;
  const confirm = document.getElementById('authPassConfirm').value;
  const tos     = document.getElementById('checkTos').checked;
  const disc    = document.getElementById('checkDisclaimer').checked;
  const err     = document.getElementById('authErr');
  err.textContent = '';
  if (!tos)              { err.textContent = 'You must agree to the Terms of Service and Privacy Policy.'; return; }
  if (!disc)             { err.textContent = 'You must acknowledge this app is for personal tracking only.'; return; }
  if (pass.length < 8)   { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm)  { err.textContent = 'Passwords do not match.'; return; }
  try {
    await App.register(email, pass);
    await App.loadAll();
    showApp();
    renderAllTabs();
  } catch (e) {
    err.textContent = e.message || 'Registration failed. Please try again.';
  }
}

async function doForgot() {
  const email = document.getElementById('authEmail').value.trim();
  const err   = document.getElementById('authErr');
  err.textContent = '';
  if (!email) { err.textContent = 'Please enter your email.'; return; }
  try {
    await API.post('/auth/forgot', { email });
    document.getElementById('forgotSuccess').style.display = 'block';
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Please try again.';
  }
}

async function doReset(token) {
  const pass    = document.getElementById('authPass').value;
  const confirm = document.getElementById('authPassConfirm').value;
  const err     = document.getElementById('authErr');
  err.textContent = '';
  if (pass.length < 8)  { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm) { err.textContent = 'Passwords do not match.'; return; }
  try {
    await API.post('/auth/reset', { token, password: pass });
    renderAuth('login');
  } catch (e) {
    err.textContent = e.message || 'Reset failed. The link may have expired.';
  }
}

// ── Task 10: Today ─────────────────────────────────────────────────────────────
function calcStreak(logs) {
  let streak = 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(today.getTime() - i * 86400000);
    const ds = ymd(d);
    const hasLog = logs.some(l => l.taken_at && takenYmd(l.taken_at) === ds);
    if (hasLog) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function calcBestStreak(logs) {
  if (!logs.length) return 0;
  const days = [...new Set(logs.map(l => l.taken_at ? takenYmd(l.taken_at) : null).filter(Boolean))].sort();
  let best = 0, current = 0, prev = null;
  for (const day of days) {
    if (prev) {
      const diff = (new Date(day) - new Date(prev)) / 86400000;
      current = diff === 1 ? current + 1 : 1;
    } else {
      current = 1;
    }
    best = Math.max(best, current);
    prev = day;
  }
  return best;
}

function renderToday() {
  const { planner, logs, settings, vials } = App.getData();
  const today = new Date();
  const todayYmd = ymd(today);

  const doneCount    = todayPlans.filter(p => planMatched(p, todayLogs)).length;
  const pendingCount = todayPlans.length - doneCount;
  const streak       = calcStreak(logs);

  let doseRows = '';

function quickLog(planId, dayYmd) {
  const { planner } = App.getData();
  const plan = planner.find(p => p.id === planId);
  Tabs.switchTo('logdose');
  if (!plan) return;
  // Render once, then set ALL form fields including ldTakenAt
  renderLogDose();
  const ldPeptide = document.getElementById('ldPeptide');
  const ldRoute   = document.getElementById('ldRoute');
  const ldDose    = document.getElementById('ldDose');
  const ldUnit    = document.getElementById('ldUnit');
  const ldTakenAt = document.getElementById('ldTakenAt');
  const now = new Date();
  const todayYmd  = ymd(now);
  const currentHHMM = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const planTime  = plan.time || currentHHMM;
  if (ldPeptide) ldPeptide.value = plan.peptide;
  if (ldRoute)   ldRoute.value   = plan.route;
  if (ldDose)    ldDose.value    = plan.dose;
  if (ldUnit)    ldUnit.value    = plan.unit;
  if (ldTakenAt) {
    if (dayYmd !== todayYmd) {
      ldTakenAt.value = `${dayYmd}T${planTime}`;
    } else {
      ldTakenAt.value = `${todayYmd}T${planTime}`;
    }
  }
  updateDrawMath();
}

  today.setHours(0, 0, 0, 0);

  let weekStart;
  if (settings.week_start) {
    weekStart = new Date(settings.week_start + 'T00:00:00');
  } else {
    weekStart = new Date(today);
    weekStart.setDate(today.getDate() - today.getDay());

  weekStart.setHours(0, 0, 0, 0);

  const weekStartYmd = ymd(weekStart);
  const todayYmd = ymd(today);

  let colsHtml = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart.getTime() + i * 86400000);
    const dayYmd = ymd(d);
    const dayOfWeek = d.getDay();
    const isToday = dayYmd === todayYmd;
    const dayLogs = logs.filter(l => l.taken_at && takenYmd(l.taken_at) === dayYmd);
    const dayPlans = planner.filter(p => p.day === dayOfWeek);
    const dayDone = dayPlans.filter(p => planMatched(p, dayLogs)).length;

    let rowsHtml = '';
    for (const plan of dayPlans) {
      const done = planMatched(plan, dayLogs);
      rowsHtml += `
        <div style="padding:6px 8px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--glass-border);margin-bottom:4px;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="badge ${done ? 'badge-done' : 'badge-pending'}" style="font-size:10px;">${done ? '&#x2713;' : '&#x25CB;'}</span>
            <span style="font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(plan.peptide)}</span>${peptideInfoBtn(plan.peptide)}
          </div>
          <div class="muted" style="margin-top:2px;">${plan.dose} ${escHtml(plan.unit)}</div>
          ${!done ? `<button class="btn btn-sm btn-ghost" style="font-size:11px;padding:3px 8px;margin-top:4px;width:100%;" onclick="quickLog('${plan.id}','${dayYmd}')">Log</button>` : ''}
        </div>`;
    }
    // Logged doses for the day — shown regardless of planner so logs are never invisible.
    // Doses already represented by a ticked planner row are skipped to avoid doubles.
    const unplannedLogs = dayLogs.filter(l => !dayPlans.some(p =>
      p.peptide === l.peptide && p.unit === l.dose_unit &&
      Math.abs(Number(l.dose_value) - Number(p.dose)) / Math.max(Number(p.dose), 1e-9) <= 0.02));
    if (unplannedLogs.length) {
      const sorted = [...unplannedLogs].sort((a, b) => (a.taken_at || '').localeCompare(b.taken_at || ''));
      for (const l of sorted) {
        rowsHtml += `
        <div style="padding:6px 8px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--glass-border);margin-bottom:4px;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="badge badge-done" style="font-size:10px;">&#x2713;</span>
            <span style="font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(l.peptide)}</span>${peptideInfoBtn(l.peptide)}
          </div>
          <div class="muted" style="margin-top:2px;">${l.dose_value} ${escHtml(l.dose_unit)} logged</div>
        </div>`;
      }
    }
    if (dayPlans.length === 0 && dayLogs.length === 0) {
      rowsHtml = '<p class="muted" style="font-size:11px;padding:4px 0;">Rest day</p>';
    }

    const statusLine = dayPlans.length
      ? `${dayDone}/${dayPlans.length} done`
      : (dayLogs.length ? `${dayLogs.length} logged` : '&nbsp;');
    colsHtml += `
      <div style="border-radius:12px;padding:12px;background:var(--chip-bg);border:${isToday ? '2px solid var(--accent-sky)' : '1px solid var(--glass-border)'};">
        <div style="font-weight:700;font-size:13px;${isToday ? 'color:var(--accent-sky);' : ''}">${DAYS[dayOfWeek]}</div>

        <div class="muted" style="margin-bottom:8px;">${statusLine}</div>
        ${rowsHtml}
      </div>`;
  }

  document.getElementById('week').innerHTML = `
    <div class="stack">
      <div class="glass" style="padding:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
          <h3 style="font-size:15px;font-weight:700;">Week View</h3>

                .catch(e => alert(e.message));
            " />
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;overflow-x:auto;">
          ${colsHtml}
        </div>
      </div>
      <p class="disclaimer">For research and personal tracking purposes only. Not medical advice.</p>
    </div>`;

// ── Task 12: Log Dose ──────────────────────────────────────────────────────────
function calcDrawMath(vialId, doseValue, doseUnit, vials) {
  const vial = vials.find(v => v.id === vialId);
  if (!vial || !vial.mg || !vial.ml) return null;
  const conc = (parseFloat(vial.mg) * 1000) / parseFloat(vial.ml);
  if (!conc || isNaN(conc)) return null;
  let doseMcg;
  if (doseUnit === 'mcg') doseMcg = Number(doseValue);
  else if (doseUnit === 'mg') doseMcg = Number(doseValue) * 1000;
  else if (doseUnit === 'IU') {
    const volFromIU = Number(doseValue) / _syringeType;
    doseMcg = volFromIU * conc;
  }
  else return null; // 'sprays' or other non-injectable units — no draw math
  if (isNaN(doseMcg) || doseMcg <= 0) return null;
  const volMl = doseMcg / conc;
  const iu    = volMl * _syringeType;
  return { conc: conc.toFixed(1), vol: volMl.toFixed(3), iu: iu.toFixed(1), mcg: doseMcg.toFixed(1), volMl };
}

function updateDrawMath() {
  const ldVial   = document.getElementById('ldVial');
  const ldDose   = document.getElementById('ldDose');
  const ldUnit   = document.getElementById('ldUnit');
  const ldMath   = document.getElementById('ldMath');
  if (!ldMath) return;
  if (!ldVial || !ldVial.value || !ldDose || !ldDose.value) {
    ldMath.innerHTML = '<p class="muted" style="padding:12px;text-align:center;">Select a vial and enter dose</p>';
    return;
  }
  const { vials } = App.getData();
  const route = (document.getElementById('ldRoute') || {}).value;
  if (route === 'Intranasal') {
    const m = calcSprayMath(ldVial.value, ldDose.value, ldUnit ? ldUnit.value : 'mcg', vials);
    if (!m) {
      ldMath.innerHTML = '<p class="muted" style="padding:12px;text-align:center;">Select the vial your spray bottle was filled from and enter a dose (mcg, mg, or sprays)</p>';
      return;
    }
    const spraysExact = parseFloat(m.sprays.toPrecision(3));
    const spraysRounded = Math.max(1, Math.round(m.sprays));
    ldMath.innerHTML = `
      <div style="padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
          <p class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Spray Math</p>
          <span class="muted" style="font-size:11px;">${_sprayPumpMl.toFixed(2)} mL/spray pump</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div class="muted" style="font-size:11px;">Concentration</div><div style="font-weight:700;">${m.conc.toFixed(0)} mcg/mL</div></div>
          <div><div class="muted" style="font-size:11px;">Per Spray</div><div style="font-weight:700;">${m.perSprayMcg.toFixed(0)} mcg</div></div>
          <div><div class="muted" style="font-size:11px;">Dose</div><div style="font-weight:700;color:var(--accent-sky);">${m.doseMcg.toFixed(0)} mcg</div></div>
          <div><div class="muted" style="font-size:11px;">Sprays</div><div style="font-weight:700;color:var(--accent-indigo);">${spraysExact}${Math.abs(m.sprays - spraysRounded) > 0.01 ? ` (≈${spraysRounded})` : ''}</div></div>
        </div>
      </div>`;
    return;
  }
  const result = calcDrawMath(ldVial.value, ldDose.value, ldUnit ? ldUnit.value : 'mcg', vials);
  if (!result) {
    ldMath.innerHTML = '<p class="muted" style="padding:12px;text-align:center;">Select a vial and enter dose</p>';
    return;
  }
  const doseMcg = parseFloat(result.mcg);
  const doseDisplay = _drawDisplayUnit === 'mg' ? `${parseFloat((doseMcg / 1000).toPrecision(6))} mg`
    : _drawDisplayUnit === 'IU' ? `${result.iu} units`
    : `${result.mcg} mcg`;
  const unitBtns = ['mcg', 'mg', 'IU'].map(u =>
    `<button class="btn btn-sm ${_drawDisplayUnit === u ? 'btn-primary' : 'btn-ghost'}" style="padding:2px 8px;font-size:11px;" onclick="setDrawDisplayUnit('${u}')">${u === 'IU' ? 'units' : u}</button>`
  ).join('');
  ldMath.innerHTML = `
    <div style="padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
        <p class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Draw Math</p>

// Spray math for intranasal doses: vial concentration × pump output per spray
function calcSprayMath(vialId, doseValue, doseUnit, vials) {
  const vial = vials.find(v => v.id === vialId);
  if (!vial || !vial.mg || !vial.ml) return null;
  const conc = (parseFloat(vial.mg) * 1000) / parseFloat(vial.ml);
  if (!conc || isNaN(conc) || !_sprayPumpMl) return null;
  const perSprayMcg = conc * _sprayPumpMl;
  const d = Number(doseValue);
  if (isNaN(d) || d <= 0) return null;
  let doseMcg, sprays;
  if (doseUnit === 'sprays')   { sprays = d; doseMcg = d * perSprayMcg; }
  else if (doseUnit === 'mcg') { doseMcg = d; sprays = d / perSprayMcg; }
  else if (doseUnit === 'mg')  { doseMcg = d * 1000; sprays = doseMcg / perSprayMcg; }
  else return null; // IU has no intranasal meaning
  return { conc, perSprayMcg, doseMcg, sprays, volMl: sprays * _sprayPumpMl };
}

  return route === 'Intranasal' ? ['mcg', 'mg', 'IU', 'sprays'] : ['mcg', 'mg', 'IU'];

// Least-recently-used applicable site for the route; never-used sites win first,
// in registry order — that alone walks a sensible rotation.
function suggestSiteKey(route, logs) {
  const candidates = SITES.filter(s => s.routes.includes(route));
  if (!candidates.length) return null;
  const lastUse = {};
  logs.forEach(l => {
    if (l.site && (!lastUse[l.site] || l.taken_at > lastUse[l.site])) lastUse[l.site] = l.taken_at;
  });
  let best = null, bestT = null;
  for (const s of candidates) {
    const t = lastUse[s.key] || '';
    if (best === null || t < bestT) { best = s; bestT = t; }
  }
  return best.key;
}

function daysAgoLabel(takenAt) {
  const then = new Date(takenAt); then.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = Math.round((today - then) / 86400000);
  return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : `${d} days ago`;
}

// Shared Application Site card — rendered on both the Today and Dashboard tabs.
function appSiteCardHtml(logs) {
  const sorted = [...logs].sort((a, b) => (b.taken_at || '').localeCompare(a.taken_at || ''));

  // One marker per site: most recent use, fading with age
  const seen = {};
  sorted.forEach(l => {
    if (l.site && !(l.site in seen)) seen[l.site] = l.taken_at;
  });
  const markerOverlay = view => Object.entries(seen).map(([key, takenAt]) => {
    const s = siteByKey(key);
    if (!s || s.view !== view) return '';
    const age = Math.round((Date.now() - new Date(takenAt)) / 86400000);
    const opacity = age <= 7 ? 1 : age <= 30 ? 0.55 : 0.3;
    return `<circle cx="${s.x}" cy="${s.y}" r="8" fill="var(--accent-sky)" opacity="${opacity}"><title>${s.label} — ${daysAgoLabel(takenAt)}</title></circle>`;
  }).join('');

  const recent = sorted.slice(0, 3);
  const listRows = recent.length ? recent.map(l => {
    const s = siteByKey(l.site);
    const label = s ? s.label : (l.site || null);
    return `
      <div style="padding:6px 0;border-bottom:1px solid var(--glass-border);">
        <div class="muted" style="font-size:11px;">${daysAgoLabel(l.taken_at)}</div>
        <div style="font-weight:700;font-size:14px;${label ? '' : 'color:var(--text-muted);font-weight:600;'}">${label ? escHtml(label) : 'Site not recorded'}</div>
        <div class="muted" style="font-size:12px;">${escHtml(l.peptide)}</div>
      </div>`;
  }).join('') : '<p class="muted" style="padding:8px 0;">No doses logged yet.</p>';

  return `
    <div class="glass" style="padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;cursor:pointer;" onclick="Tabs.switchTo('history')">
        <h3 style="font-size:15px;font-weight:700;">◎ Application Site</h3>
        <span class="muted" style="font-size:18px;">→</span>
      </div>
      <div style="display:flex;gap:14px;align-items:flex-start;">
        <div style="display:flex;gap:6px;">
          ${bodyFigureSvg('front', markerOverlay('front'), 88)}
          ${bodyFigureSvg('back', markerOverlay('back'), 88)}
        </div>
        <div style="flex:1;min-width:0;">${listRows}</div>
      </div>
    </div>`;
}

async function saveLog() {
  const peptide = document.getElementById('ldPeptide').value;
  const dose    = document.getElementById('ldDose').value;
  const unit    = document.getElementById('ldUnit').value;
  const route   = document.getElementById('ldRoute').value;
  const takenAt = document.getElementById('ldTakenAt').value;
  const vialId  = document.getElementById('ldVial').value;
  const site    = document.getElementById('ldSite').value;
  const notes   = document.getElementById('ldNotes').value.trim();

  if (!peptide) { alert('Please select a peptide.'); return; }
  if (!dose || isNaN(parseFloat(dose))) { alert('Please enter a dose value.'); return; }
  if (!takenAt) { alert('Please select a date and time.'); return; }

  const { vials } = App.getData();
  let math = null;
  if (vialId) {
    if (route === 'Intranasal') {
      const m = calcSprayMath(vialId, dose, unit, vials);
      if (m) math = { mcg: m.doseMcg.toFixed(1), vol: m.volMl.toFixed(3), iu: null };
    } else {
      math = calcDrawMath(vialId, dose, unit, vials);
    }
  }

  const payload = {
    peptide, route,
    dose_value: parseFloat(dose),
    dose_unit: unit,
    taken_at: new Date(takenAt).toISOString(),
    vial_id: vialId || null,
    dose_mcg: math ? parseFloat(math.mcg) : null,
    volume_ml: math ? parseFloat(math.vol) : null,
    iu: math && math.iu != null ? parseFloat(math.iu) : null,
    site: site || null,
    notes: notes || null
  };

  try {
    const returnTab = _editingLogId ? _editLogReturnTab : 'today';
    if (_editingLogId) {
      await API.put('/logs/' + _editingLogId, payload);
      _editingLogId = null;
    } else {
      await API.post('/logs', payload);
    }
    // Blank the in-progress fields BEFORE re-render — renderLogDose preserves DOM
    // values, so without this the form comes back looking untouched after a save
    ['ldDose', 'ldNotes', 'ldVial', 'ldTakenAt', 'ldSite'].forEach(fid => {
      const el = document.getElementById(fid);
      if (el) el.value = '';
    });
    await App.loadAll();
    renderLogViews();
    Tabs.switchTo(returnTab);
  } catch (e) {
    alert('Failed to save: ' + (e.message || 'Unknown error'));
  }
}

// ── Task 13: Vials ─────────────────────────────────────────────────────────────
function vialRemMcg(vial, logs) {
  const totalMcg = parseFloat(vial.mg) * 1000;
  const usedMcg  = logs
    .filter(l => l.vial_id === vial.id && l.dose_mcg != null &&
      (!vial.reset_at || (l.taken_at || '') > vial.reset_at)) // doses before a reset belong to the previous fill
    .reduce((sum, l) => sum + parseFloat(l.dose_mcg), 0);
  return Math.max(0, totalMcg - usedMcg);
}

// Mini vial glyph: liquid level = remaining fraction, Vials-tab color thresholds.
function vialLevelHtml(vial, logs) {
  if (!vial) return '';
  const totalMcg = parseFloat(vial.mg) * 1000;
  if (!totalMcg) return '';
  const remMcg = vialRemMcg(vial, logs);
  const pct = Math.max(0, Math.min(100, Math.round((remMcg / totalMcg) * 100)));
  const color = pct > 50 ? 'var(--accent-green)' : pct > 20 ? 'var(--accent-amber)' : '#ef4444';
  const remText = remMcg >= 1000 ? `${(remMcg / 1000).toFixed(1).replace(/\.0$/, '')} mg` : `${Math.round(remMcg)} mcg`;
  const liquidH = 15 * pct / 100; // body spans y=6..21 in the 14×24 viewBox
  return `
    <span title="${escHtml(vial.peptide)}: ${Math.round(remMcg)} mcg remaining (${pct}%)"
      style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;" onclick="event.stopPropagation();Tabs.switchTo('vials')">
      <svg viewBox="0 0 14 24" width="14" height="24" aria-label="vial level ${pct}%">
        <rect x="4.5" y="0.5" width="5" height="3" rx="1" fill="var(--text-muted)" opacity="0.55"/>
        <rect x="2.5" y="6.5" width="9" height="14.5" rx="2.5" fill="none" stroke="var(--text-muted)" stroke-width="1.2" opacity="0.65"/>
        <rect x="5.5" y="3.5" width="3" height="3" fill="none" stroke="var(--text-muted)" stroke-width="1.2" opacity="0.65"/>
        <rect x="3.6" y="${20.4 - liquidH}" width="6.8" height="${liquidH}" rx="1.5" fill="${color}" opacity="0.9"/>
      </svg>
      <span class="muted" style="font-size:11px;color:${color};white-space:nowrap;">${remText}</span>
    </span>`;
}

// The vial you'd draw from next for a peptide: non-empty, most recently drawn
// from (falls back to newest created).
function nextVialForPeptide(peptide, vials, logs) {
  const candidates = vials.filter(v => v.peptide === peptide && vialRemMcg(v, logs) > 0);
  if (!candidates.length) return null;
  const lastUse = {};
  logs.forEach(l => {
    if (l.vial_id && (!lastUse[l.vial_id] || l.taken_at > lastUse[l.vial_id])) lastUse[l.vial_id] = l.taken_at;
  });
  return candidates.sort((a, b) =>
    (lastUse[b.id] || b.created_at || '').localeCompare(lastUse[a.id] || a.created_at || ''))[0];
}

// One tap moves a delivered order's items into stock. Order items are
// {peptide, qty, unit} where qty is the vial STRENGTH (e.g. 10 mg), so we ask
// how many vials arrived per item.
async function orderToInventory(orderId) {
  const { orders, inventory } = App.getData();
  const o = orders.find(x => x.id === orderId);
  if (!o) return;
  let items = [];
  try { items = JSON.parse(o.items || '[]'); } catch {}
  if (!items.length) { alert('This order has no items to add.'); return; }
  try {
    for (const it of items) {
      const size = it.qty ? `${it.qty} ${it.unit || 'mg'}` : null;
      const label = `${it.peptide}${size ? ' ' + size : ''}`;
      const ans = prompt(`How many vials of ${label} arrived?`, '1');
      if (ans === null) continue; // skipped this item
      const count = parseFloat(ans);
      if (!count || count <= 0) continue;
      const existing = inventory.find(x => x.category === 'Peptide' &&
        x.name.toLowerCase() === it.peptide.toLowerCase() && (x.size || '') === (size || ''));
      if (existing) {
        await API.put('/inventory/' + existing.id, { ...existing, qty: Number(existing.qty) + count });
      } else {
        await API.post('/inventory', { name: it.peptide, category: 'Peptide', size, qty: count });
      }
    }
    await API.put('/orders/' + orderId, { ...o, status: 'Stored' });
    await App.loadAll();
    renderInventory();
    renderOrders();
    renderDashboard();
    Tabs.switchTo('inventory');
  } catch (e) {
    alert('Failed to move order into inventory: ' + (e.message || 'Unknown error'));
  }
}

// After reconstituting (creating a vial), offer to consume one sealed vial of
// that peptide from stock.
async function maybeDeductInventory(peptideName) {
  const match = (App.getData().inventory || []).find(x =>
    x.category === 'Peptide' && Number(x.qty) > 0 &&
    x.name.toLowerCase() === peptideName.toLowerCase());
  if (!match) return;
  if (!confirm(`Deduct 1 × ${match.name}${match.size ? ' ' + match.size : ''} from inventory? (${Number(match.qty)} on hand)`)) return;
  try {
    await API.put('/inventory/' + match.id, { ...match, qty: Number(match.qty) - 1 });
    await App.loadAll();
    renderInventory();
    renderDashboard();
  } catch (e) {
    alert('Failed to deduct from inventory: ' + (e.message || 'Unknown error'));
  }
}

// ── Cycle suggestions ──────────────────────────────────────────────────────────
// Suggest a cycle for any peptide being logged with no covering cycle. The run
// start comes from the user's actual entries; the length from the library.
let _cycleSuggestOpen = null;
const CYCLE_DISMISS_KEY = 'pepos_cycle_dismissed';

// {lo, hi} weeks from a library cycleLength, or null when it isn't a plain
// range ("As needed", "Continuous", …). Keeps any on/off text for display.
function cycleRecRange(peptide) {
  const str = findLibraryEntry(peptide)?.cycleLength;
  if (!str) return null;
  const m = str.match(/(\d+)\s*(?:[\u2013-]\s*(\d+))?\s*(week|month)/i);
  if (m) {
    const mult = m[3].toLowerCase() === 'month' ? 4.345 : 1; // months → weeks
    const lo = Number(m[1]) * mult;
    const hi = (m[2] ? Number(m[2]) : Number(m[1])) * mult;
    const label = m[2] ? `${m[1]}–${m[2]} ${m[3].toLowerCase()}s` : `${m[1]} ${m[3].toLowerCase()}${m[1] === '1' ? '' : 's'}`;
    return { lo, hi, label, text: str };
  }
  return { lo: null, hi: null, label: null, text: str }; // unparseable — display text only
}

// "Recommended 8–12 wk · yours 10 wk ✓" line for a cycle row; '' if unknown peptide.
function cycleRecLine(c) {
  const rec = cycleRecRange(c.peptide);
  if (!rec) return '';
  const wk = n => `${parseFloat(n.toFixed(1))} wk`;
  if (rec.lo === null) {
    return `<div class="muted" style="font-size:11px;margin-top:4px;">Recommended: ${escHtml(rec.text)}</div>`;
  }
  const yours = (new Date(c.end_date + 'T00:00:00') - new Date(c.start_date + 'T00:00:00')) / 86400000 / 7 + 1 / 7;
  const recLabel = rec.label;
  let verdict, color;
  if (yours > rec.hi) {
    verdict = `— runs ${wk(yours - rec.hi)} over`; color = 'var(--accent-amber)';
  } else if (yours < rec.lo) {
    verdict = '— shorter than recommended'; color = 'var(--text-muted)';
  } else {
    verdict = '✓'; color = 'var(--accent-green)';
  }
  return `<div style="font-size:11px;margin-top:4px;color:${color};">Recommended ${recLabel}${rec.text.includes('/') ? ` (${escHtml(rec.text)})` : ''} · yours ${wk(yours)} ${verdict}</div>`;
}

function parseCycleWeeks(str) {
  if (!str) return 8;
  const range = str.match(/(\d+)\s*[\u2013-]\s*(\d+)\s*week/i);
  if (range) return Math.round((Number(range[1]) + Number(range[2])) / 2);
  const single = str.match(/(\d+)\s*week/i);
  if (single) return Number(single[1]);
  return 8;
}

function cycleDismissals() {
  try { return JSON.parse(localStorage.getItem(CYCLE_DISMISS_KEY) || '{}'); } catch { return {}; }
}

function dismissCycleSuggest(pep, start) {
  const d = cycleDismissals();
  d[pep + '|' + start] = true;
  localStorage.setItem(CYCLE_DISMISS_KEY, JSON.stringify(d));
  _cycleSuggestOpen = null;
  renderDashboard();
}

function suggestCycles(logs, cycles) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayStr = ymd(today);
  const dism = cycleDismissals();
  const byPep = {};
  logs.forEach(l => {
    if (l.taken_at) (byPep[l.peptide] = byPep[l.peptide] || new Set()).add(takenYmd(l.taken_at));
  });
  const out = [];
  for (const [pep, daySet] of Object.entries(byPep)) {
    const days = [...daySet].sort().reverse();
    if ((today - new Date(days[0] + 'T00:00:00')) / 86400000 > 14) continue; // not currently active
    let runStart = days[0]; // walk back through entries, a >21d gap ends the run
    for (let i = 1; i < days.length; i++) {
      const gap = (new Date(days[i - 1] + 'T00:00:00') - new Date(days[i] + 'T00:00:00')) / 86400000;
      if (gap > 21) break;
      runStart = days[i];
    }
    if (dism[pep + '|' + runStart]) continue;
    const overlaps = (cycles || []).some(c => c.peptide === pep &&
      !(c.end_date < runStart || c.start_date > todayStr));
    if (overlaps) continue;
    const weeks = parseCycleWeeks(findLibraryEntry(pep)?.cycleLength);
    let end = new Date(new Date(runStart + 'T00:00:00').getTime() + (weeks * 7 - 1) * 86400000);
    const minEnd = new Date(today.getTime() + 7 * 86400000); // never suggest a cycle that's already over
    if (end < minEnd) end = minEnd;
    out.push({ peptide: pep, start: runStart, end: ymd(end), weeks });
  }
  return out.sort((a, b) => a.peptide.localeCompare(b.peptide));
}

async function confirmCycleSuggest(pep) {
  const start = document.getElementById('csStart').value;
  const end = document.getElementById('csEnd').value;
  if (!start || !end || end < start) { alert('Please set valid start and end dates.'); return; }
  try {
    await API.post('/cycles', { peptide: pep, start_date: start, end_date: end });
    _cycleSuggestOpen = null;
    await App.loadAll();
    renderDashboard();
    renderSettings(); // cycles are managed there too
  } catch (e) {
    alert('Failed to add cycle: ' + (e.message || 'Unknown error'));
  }
}

function cycleSuggestionsHtml(logs, cycles) {
  return suggestCycles(logs, cycles).map(s => {
    const open = _cycleSuggestOpen === s.peptide;
    return `
      <div style="padding:10px 12px;border-radius:10px;background:rgba(245,158,11,0.10);border:1px solid rgba(245,158,11,0.35);margin-top:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:13px;">&#x1F4A1; <strong>${escHtml(s.peptide)}</strong>${peptideInfoBtn(s.peptide)} &mdash; logging since ${s.start}, no active cycle</span>
          <span style="display:flex;gap:6px;">
            ${open ? '' : `<button class="btn btn-primary btn-sm" data-pep="${escHtml(s.peptide)}" onclick="_cycleSuggestOpen=this.dataset.pep;renderDashboard()">Add</button>`}
            <button class="btn btn-ghost btn-sm" data-pep="${escHtml(s.peptide)}" data-start="${s.start}" onclick="dismissCycleSuggest(this.dataset.pep,this.dataset.start)">Dismiss</button>
          </span>

          <label style="font-size:11px;flex-direction:column;">End (&#x2248;${s.weeks} wk)<input type="date" id="csEnd" value="${s.end}" style="width:auto;"></label>
          <button class="btn btn-primary btn-sm" data-pep="${escHtml(s.peptide)}" onclick="confirmCycleSuggest(this.dataset.pep)">Confirm</button>
          <button class="btn btn-ghost btn-sm" onclick="_cycleSuggestOpen=null;renderDashboard()">Cancel</button>
        </div>` : ''}
      </div>`;
  }).join('');
}

function renderDashboard() {
  const { logs, planner, peptides, settings, cycles } = App.getData();

  const totalDoses = logs.length;

  let cycleHTML = '<p class="muted" style="text-align:center;">No active cycle — add peptide cycles in Settings.</p>';
  if (cycles && cycles.length) {
    const todayD = new Date(); todayD.setHours(0, 0, 0, 0);
    const rows = cycles
      .filter(c => {
        const end = new Date(c.end_date + 'T00:00:00');

      })
      .map(c => {
        const start = new Date(c.start_date + 'T00:00:00');
        const end   = new Date(c.end_date + 'T00:00:00');
        const totalDays = Math.max(1, Math.round((end - start) / 86400000));

          const daysLeft = Math.round((end - todayD) / 86400000);
          const pct = Math.max(0, Math.min(100, Math.round((dayNum / totalDays) * 100)));
          const doseCount = logs.filter(l => l.peptide === c.peptide && l.taken_at &&

          statusHtml = `<span class="muted" style="font-size:12px;">Day ${dayNum}/${totalDays} · ${daysLeft}d left${doseCount ? ` · ${doseCount} dose${doseCount === 1 ? '' : 's'}` : ''}</span>`;

            <div style="padding:10px 12px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--glass-border);">

              <div style="display:flex;justify-content:space-between;margin-top:4px;">
                <span class="muted" style="font-size:11px;">${c.start_date}</span>
                <span class="muted" style="font-size:11px;">${c.end_date}</span>
              </div>
              ${cycleRecLine(c)}
            </div>`;
        }
        return `
          <div style="padding:10px 12px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--glass-border);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span style="font-weight:700;font-size:13px;">${escHtml(c.peptide)}</span>
              <span class="muted" style="font-size:12px;">${c.start_date} → ${c.end_date}</span>
              ${statusHtml}
            </div>
            ${cycleRecLine(c)}
          </div>`;
      });
    cycleHTML = rows.length ? `<div class="stack">${rows.join('')}</div>`
      : '<p class="muted" style="text-align:center;">All cycles finished — add the next one in Settings.</p>';
  } else if (cs && ce) {
    const start = new Date(cs + 'T00:00:00'), end = new Date(ce + 'T00:00:00'), now = new Date();
    const total = end - start, elapsed = now - start;
    const pct = Math.max(0, Math.min(100, Math.round(elapsed / total * 100)));
    const dayNum = Math.max(1, Math.ceil(elapsed / 86400000));
    const daysLeft = Math.max(0, Math.ceil((end - now) / 86400000));
    cycleHTML = `
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <div style="text-align:center;min-width:60px;">
          <div class="muted" style="font-size:11px;text-transform:uppercase;">Cycle Day</div>
          <div style="font-size:28px;font-weight:800;color:var(--accent-sky);">${dayNum}</div>
        </div>
        <div style="flex:1;min-width:120px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span class="muted" style="font-size:12px;">Progress</span>
            <span class="muted" style="font-size:12px;">${pct}%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:4px;">
            <span class="muted" style="font-size:11px;">${cs}</span>
            <span class="muted" style="font-size:11px;">${daysLeft}d left</span>
            <span class="muted" style="font-size:11px;">${ce}</span>

        </div>
        <div style="text-align:center;min-width:60px;">
          <div class="muted" style="font-size:11px;text-transform:uppercase;">Days Left</div>
          <div style="font-size:28px;font-weight:800;color:var(--accent-indigo);">${daysLeft}</div>

  // Streak calendar — 91 days (13 weeks), CSS grid

  for (let i = 0; i < 91; i++) {

    const ds = ymd(d);
    const count = logs.filter(l => l.taken_at && takenYmd(l.taken_at) === ds).length;
    const color = count === 0 ? 'var(--input-border)' : count <= 2 ? 'rgba(14,165,233,0.4)' : 'var(--accent-sky)';
    const isToday = ds === ymd(calToday);
    calCells.push(`<div title="${ds}: ${count} dose${count !== 1 ? 's' : ''}" style="width:12px;height:12px;border-radius:2px;background:${color};${isToday ? 'outline:2px solid var(--accent-sky);outline-offset:1px;' : ''}"></div>`);
  }

  // Keyed cards so the user can rearrange them; order lives in settings.dash_order
  const cardMap = {
    stats: `
      <div class="glass" style="padding:18px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div class="chip">🔥 Streak: <strong style="margin-left:4px;">${streak}d</strong></div>
          <div class="chip">🏆 Best: <strong style="margin-left:4px;">${bestStreak}d</strong></div>
          <div class="chip">💉 Total doses: <strong style="margin-left:4px;">${totalDoses}</strong></div>
          <div class="chip">🧪 Peptides used: <strong style="margin-left:4px;">${uniquePeps}</strong></div>
          ${lowStockItems().length ? `<div class="chip" style="background:rgba(239,68,68,0.12);color:#ef4444;cursor:pointer;" onclick="Tabs.switchTo('inventory')">⚠️ Low stock: <strong style="margin-left:4px;">${lowStockItems().length}</strong></div>` : ''}
        </div>
      </div>`,
    cycles: `
      <div class="glass" style="padding:18px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Cycle Progress</h3>

        ${cycleSuggestionsHtml(logs, cycles || [])}
      </div>`,
    appsite: appSiteCardHtml(logs),
    calendar: `
      <div class="glass" style="padding:18px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;">Last 91 Days</h3>
        <div style="display:grid;grid-template-columns:repeat(13,12px);gap:3px;">${calCells.join('')}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <span class="muted" style="font-size:11px;">Less</span>
          <div style="width:10px;height:10px;border-radius:2px;background:var(--input-border);"></div>
          <div style="width:10px;height:10px;border-radius:2px;background:rgba(14,165,233,0.4);"></div>
          <div style="width:10px;height:10px;border-radius:2px;background:var(--accent-sky);"></div>
          <span class="muted" style="font-size:11px;">More</span>
        </div>
      </div>`,
    compliance: `
      <div class="glass" style="padding:18px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;">7-Day Compliance</h3>
        ${planner.length === 0
          ? '<p class="muted">Add planner items to see compliance.</p>'
          : '<canvas id="complianceChart" height="120" style="width:100%;max-width:500px;display:block;"></canvas>'}
      </div>`,
    toppeps: `
      <div class="glass" style="padding:18px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:12px;">Top Peptides</h3>
        ${uniquePeps < 2
          ? '<p class="muted">Log more doses to see your top peptides.</p>'
          : '<canvas id="topPeptidesChart" height="200" style="width:100%;max-width:500px;display:block;"></canvas>'}
      </div>`
  };

  const order = dashCardOrder(settings);
  const cardsHtml = order.map((key, i) => `
    <div style="position:relative;">
      ${_dashEditMode ? `
        <div style="position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:4px;">
          <button class="btn btn-ghost btn-sm" style="padding:2px 10px;" ${i === 0 ? 'disabled' : ''} data-key="${key}" onclick="moveDashCard(this.dataset.key, -1)">↑</button>
          <button class="btn btn-ghost btn-sm" style="padding:2px 10px;" ${i === order.length - 1 ? 'disabled' : ''} data-key="${key}" onclick="moveDashCard(this.dataset.key, 1)">↓</button>
        </div>` : ''}
      ${cardMap[key]}
    </div>`).join('');

  document.getElementById('dashboard').innerHTML = `
    <div class="stack">
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="_dashEditMode=!_dashEditMode;renderDashboard()">${_dashEditMode ? '✓ Done' : '⇅ Edit layout'}</button>
      </div>
      ${cardsHtml}
    </div>`;

  setTimeout(drawDashboardCharts, 0);
}

const DASH_CARD_KEYS = ['stats', 'cycles', 'appsite', 'calendar', 'compliance', 'toppeps'];
let _dashEditMode = false;

// Saved order, with unknown keys dropped and new cards appended at the end
function dashCardOrder(settings) {
  const saved = (settings?.dash_order || '').split(',').filter(k => DASH_CARD_KEYS.includes(k));
  return [...saved, ...DASH_CARD_KEYS.filter(k => !saved.includes(k))];
}

async function moveDashCard(key, delta) {
  const { settings } = App.getData();
  const order = dashCardOrder(settings);
  const i = order.indexOf(key);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  settings.dash_order = order.join(',');
  renderDashboard();
  await API.put('/settings', Object.assign({}, settings, { dash_order: settings.dash_order })).catch(() => {});
}

function drawDashboardCharts() {
  drawComplianceChart(document.getElementById('complianceChart'));
  drawTopPeptidesChart(document.getElementById('topPeptidesChart'));
}

function drawComplianceChart(canvas) {
  if (!canvas) return;
  const { logs, planner } = App.getData();
  if (!planner.length) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 500;
  canvas.width = W;
  canvas.height = 120;
  ctx.clearRect(0, 0, W, 120);

  const isDark = document.body.dataset.theme === 'dark' ||
    (!document.body.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const textColor = isDark ? '#94a3b8' : '#64748b';
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(today.getTime() - (6-i)*86400000);
    return { label: ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()], ymd: ymd(d), dow: d.getDay() };
  });

  const maxPlanned = Math.max(1, ...days.map(d => planner.filter(p => p.day === d.dow).length));
  const barW = Math.floor((W - 40) / 7) - 4;
  const chartH = 80;

  days.forEach((day, i) => {
    const x = 20 + i * ((W - 40) / 7);
    const planned = planner.filter(p => p.day === day.dow).length;
    const done = planned ? logs.filter(l => {
      if (!l.taken_at || takenYmd(l.taken_at) !== day.ymd) return false;
      return planner.some(p => p.day === day.dow && p.peptide === l.peptide && p.unit === l.dose_unit &&
        Math.abs(Number(l.dose_value) - Number(p.dose)) / Math.max(Number(p.dose), 1e-9) <= 0.02);
    }).length : 0;

    const plannedH = Math.round((planned / maxPlanned) * chartH);
    const doneH    = Math.round((done    / maxPlanned) * chartH);

    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
    ctx.fillRect(x, 85 - plannedH, barW, plannedH);

    if (doneH > 0) {
      const grad = ctx.createLinearGradient(0, 85 - doneH, 0, 85);
      grad.addColorStop(0, '#0ea5e9');
      grad.addColorStop(1, '#6366f1');
      ctx.fillStyle = grad;
      ctx.fillRect(x, 85 - doneH, barW, doneH);
    }

    ctx.fillStyle = textColor;
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(day.label, x + barW / 2, 100);
    if (planned > 0) ctx.fillText(`${done}/${planned}`, x + barW / 2, 85 - plannedH - 3);
  });
}

function drawTopPeptidesChart(canvas) {
  if (!canvas) return;
  const { logs } = App.getData();
  const counts = {};
  logs.forEach(l => { if (l.peptide) counts[l.peptide] = (counts[l.peptide] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 8);
  if (sorted.length < 2) return;

  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 500;
  canvas.width = W;
  const rowH = 24, padLeft = 110, padRight = 40;
  canvas.height = sorted.length * rowH + 10;
  ctx.clearRect(0, 0, W, canvas.height);

  const isDark = document.body.dataset.theme === 'dark' ||
    (!document.body.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const textColor = isDark ? '#94a3b8' : '#64748b';
  const max = sorted[0][1];
  const barArea = W - padLeft - padRight;

  sorted.forEach(([name, count], i) => {
    const y = i * rowH + 5;
    const barW = Math.round((count / max) * barArea);
    const label = name.length > 14 ? name.slice(0,13) + '…' : name;

    ctx.fillStyle = textColor;
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(label, padLeft - 6, y + 14);

    const grad = ctx.createLinearGradient(padLeft, 0, padLeft + barW, 0);
    grad.addColorStop(0, '#0ea5e9');
    grad.addColorStop(1, '#6366f130');
    ctx.fillStyle = grad;
    ctx.fillRect(padLeft, y + 2, barW, rowH - 6);

    ctx.fillStyle = textColor;
    ctx.textAlign = 'left';
    ctx.fillText(String(count), padLeft + barW + 4, y + 14);
  });
}
function renderHistory() {
  const { logs, peptides } = App.getData();
  const pepOpts = peptides.map(p => `<option value="${escHtml(p.name)}">${escHtml(p.name)}</option>`).join('');

  // Read current filter values (preserve across re-renders)
  const pepFilter  = document.getElementById('histPep')?.value  || '';
  const fromFilter = document.getElementById('histFrom')?.value || '';
  const toFilter   = document.getElementById('histTo')?.value   || '';
  const txtFilter  = document.getElementById('histSearch')?.value?.toLowerCase() || '';

  // Apply filters client-side
  let filtered = [...logs].sort((a,b) => (b.taken_at||'').localeCompare(a.taken_at||''));
  if (pepFilter)  filtered = filtered.filter(l => l.peptide === pepFilter);
  if (fromFilter) filtered = filtered.filter(l => takenYmd(l.taken_at) >= fromFilter);

function exportHistoryCSV() {
  const { logs } = App.getData();
  const pepFilter  = document.getElementById('histPep')?.value  || '';
  const fromFilter = document.getElementById('histFrom')?.value || '';
  const toFilter   = document.getElementById('histTo')?.value   || '';
  const txtFilter  = document.getElementById('histSearch')?.value?.toLowerCase() || '';

  let filtered = [...logs].sort((a,b) => (b.taken_at||'').localeCompare(a.taken_at||''));
  if (pepFilter)  filtered = filtered.filter(l => l.peptide === pepFilter);
  if (fromFilter) filtered = filtered.filter(l => takenYmd(l.taken_at) >= fromFilter);
  if (toFilter)   filtered = filtered.filter(l => takenYmd(l.taken_at) <= toFilter);
  if (txtFilter)  filtered = filtered.filter(l =>
    (l.peptide||'').toLowerCase().includes(txtFilter) ||
    (l.notes||'').toLowerCase().includes(txtFilter));

  const esc = s => { s = String(s ?? ''); return (s.includes(',') || s.includes('"') || s.includes('\n')) ? `"${s.replaceAll('"','""')}"` : s; };
  const keys = ['taken_at','peptide','dose_value','dose_unit','route','site','volume_ml','iu','notes'];
  const csv  = [keys.join(','), ...filtered.map(r => keys.map(k =>
    esc(k === 'site' && r.site ? (siteByKey(r.site)?.label || r.site) : r[k])).join(','))].join('\n');

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'peptideos_history.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

async function saveOrder(editId) {
  const vendor_id   = document.getElementById('oVendorId')?.value || null;
  const vendor_name = document.getElementById('oVendorName')?.value?.trim();
  const status      = document.getElementById('oStatus')?.value || 'Ordered';
  const ordered_at  = document.getElementById('oOrderedAt')?.value || null;
  const total_cost  = Number(document.getElementById('oTotalCost')?.value) || null;
  const tracking    = document.getElementById('oTracking')?.value?.trim() || null;
  const notes       = document.getElementById('oNotes')?.value?.trim() || null;
  const items       = JSON.stringify(collectOrderItems());

  if (!vendor_name) { alert('Vendor name is required.'); return; }
  const body = { vendor_id, vendor_name, status, ordered_at, items, notes, tracking, total_cost };
  try {
    if (editId && editId !== 'null') {
      await API.put(`/orders/${editId}`, body);
    } else {
      await API.post('/orders', body);
    }
    _orderFormId = undefined;
    await App.loadAll();
    renderAllTabs();
    Tabs.switchTo('orders');
  } catch (e) { alert('Failed: ' + e.message); }
}

async function parsePriceFile() {
  const fileInput = document.getElementById('priceFile');
  const statusEl  = document.getElementById('parseStatus');
  if (!fileInput?.files?.length) { alert('Select a file first.'); return; }
  if (statusEl) statusEl.textContent = '⏳ Parsing with AI...';
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  try {
    const token = API.getToken();
    const res = await fetch('/api/parse-price-file', {
      method: 'POST',
      headers: token ? { 'Authorization': `Bearer ${token}` } : {},
      body: formData
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Parse failed');
    _parsedImport = data;
    if (statusEl) statusEl.textContent = `Found ${data.prices?.length || 0} price entries from ${data.vendors?.length || 0} vendors.`;
    renderPrices();
  } catch (e) {
    if (statusEl) statusEl.textContent = '❌ ' + e.message;
  }
}

async function confirmParsedPrices() {
  if (!_parsedImport) return;
  const { vendors: existingVendors } = App.getData();

  const rows = [];
  (_parsedImport.prices || []).forEach((p, i) => {
    const cb = document.getElementById(`imp-${i}`);
    const priceInput = document.getElementById(`imp-price-${i}`);
    if (cb?.checked) {
      rows.push({ vendor_name: p.vendor_name, peptide: p.peptide, price_per_mg: Number(priceInput?.value || p.price_per_mg) });
    }
  });
  if (!rows.length) { alert('No rows selected.'); return; }

  const vendorMap = {};
  existingVendors.forEach(v => { vendorMap[v.name.toLowerCase()] = v.id; });

  for (const parsed of (_parsedImport.vendors || [])) {
    const key = parsed.name.toLowerCase();
    if (!vendorMap[key]) {
      const result = await API.post('/vendors', { name: parsed.name, url: parsed.url || null, rating: 3, trust: 'unverified' }).catch(() => null);
      if (result?.id) vendorMap[key] = result.id;
    }
  }

  await App.loadAll();
  const freshVendors = App.getData().vendors;
  freshVendors.forEach(v => { vendorMap[v.name.toLowerCase()] = v.id; });

  let saved = 0;
  for (const row of rows) {
    const vid = vendorMap[row.vendor_name.toLowerCase()];
    if (!vid) continue;
    await API.post('/prices', { vendor_id: vid, peptide: row.peptide, price_per_mg: row.price_per_mg }).catch(() => {});
    saved++;
  }

  _parsedImport = null;
  await App.loadAll();
  renderAllTabs();
  Tabs.switchTo('prices');
  alert(`Saved ${saved} price entr${saved === 1 ? 'y' : 'ies'}.`);
}
