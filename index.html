<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PeptideOS</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PeptideOS">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8f4fd;
      --grad1: rgba(56,189,248,0.22);
      --grad2: rgba(99,102,241,0.16);
      --grad3: rgba(34,211,238,0.14);
      --text: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.85);
      --glass-shadow: 0 8px 32px rgba(14,30,60,0.10), 0 2px 8px rgba(14,30,60,0.07), inset 0 1px 0 rgba(255,255,255,0.95);
      --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.9) 40%, rgba(255,255,255,1) 60%, transparent);
      --chip-bg: rgba(255,255,255,0.65);
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(148,163,184,0.5);
      --accent-sky: #0ea5e9;
      --accent-indigo: #6366f1;
      --accent-green: #16a34a;
      --accent-amber: #d97706;
      --btn-grad: linear-gradient(135deg, #0ea5e9, #6366f1);
      --btn-glow: 0 4px 16px rgba(99,102,241,0.35);
      --radius-card: 18px;
      --radius-btn: 12px;
      --radius-input: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1e;
        --grad1: rgba(56,189,248,0.10);
        --grad2: rgba(99,102,241,0.10);
        --grad3: rgba(34,211,238,0.06);
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --glass-bg: rgba(255,255,255,0.06);
        --glass-border: rgba(255,255,255,0.12);
        --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
        --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.12) 60%, transparent);
        --chip-bg: rgba(255,255,255,0.08);
        --input-bg: rgba(255,255,255,0.05);
        --input-border: rgba(255,255,255,0.12);
        --accent-green: #4ade80;
        --accent-amber: #fbbf24;
      }
    }

    body[data-theme="dark"] {
      --bg: #0a0f1e;
      --grad1: rgba(56,189,248,0.10);
      --grad2: rgba(99,102,241,0.10);
      --grad3: rgba(34,211,238,0.06);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
      --glass-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.12) 60%, transparent);
      --chip-bg: rgba(255,255,255,0.08);
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.12);
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
    }

    body[data-theme="light"] {
      --bg: #e8f4fd;
      --grad1: rgba(56,189,248,0.22);
      --grad2: rgba(99,102,241,0.16);
      --grad3: rgba(34,211,238,0.14);
      --text: #0f172a;
      --text-muted: #64748b;
      --glass-bg: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.85);
      --glass-shadow: 0 8px 32px rgba(14,30,60,0.10), 0 2px 8px rgba(14,30,60,0.07), inset 0 1px 0 rgba(255,255,255,0.95);
      --chip-bg: rgba(255,255,255,0.65);
      --input-bg: rgba(255,255,255,0.7);
      --input-border: rgba(148,163,184,0.5);
      --accent-green: #16a34a;
      --accent-amber: #d97706;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse at 15% 10%, var(--grad1) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 80%, var(--grad2) 0%, transparent 45%),
        radial-gradient(ellipse at 55% 5%,  var(--grad3) 0%, transparent 35%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* Glass card */
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: var(--glass-shimmer);
      pointer-events: none;
      z-index: 1;
    }

    /* Nav pill */
    .nav-pill {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: var(--chip-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(14,30,60,0.09), inset 0 1px 0 rgba(255,255,255,0.8);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-pill::-webkit-scrollbar { display: none; }
    .nav-tab {
      flex: 1;
      min-width: 64px;
      text-align: center;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .nav-tab.active {
      background: var(--glass-bg);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(14,30,60,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* Buttons */
    .btn {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-btn);
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--btn-grad);
      color: white;
      box-shadow: var(--btn-glow);
    }
    .btn-ghost {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
    }
    .btn-danger {
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-sm { font-size: 12px; padding: 6px 12px; }

    /* Inputs */
    input, select, textarea {
      font-family: var(--font);
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      width: 100%;
      transition: border-color 0.15s;
      backdrop-filter: blur(8px);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-sky);
      box-shadow: 0 0 0 2px rgba(14,165,233,0.18);
    }
    textarea { min-height: 60px; resize: vertical; }
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Status badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge-done    { background: rgba(22,163,74,0.15);  color: var(--accent-green); border: 1px solid rgba(22,163,74,0.3); }
    .badge-pending { background: rgba(217,119,6,0.12);  color: var(--accent-amber); border: 1px solid rgba(217,119,6,0.3); }
    .badge-info    { background: rgba(14,165,233,0.12); color: var(--accent-sky);   border: 1px solid rgba(14,165,233,0.3); }

    /* Chip */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--chip-bg);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(8px);
    }

    /* Layout helpers */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .muted { color: var(--text-muted); font-size: 12px; }
    .divider { border: none; border-top: 1px solid var(--glass-border); margin: 8px 0; }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: var(--input-border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--btn-grad);
      transition: width 0.4s ease;
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--input-border); }
    th { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .text-right { text-align: right; }

    /* App shell */
    #app { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Auth screens */
    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card { width: 100%; max-width: 400px; padding: 32px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--btn-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-error { color: #ef4444; font-size: 13px; min-height: 18px; }

    /* Dose row */
    .dose-row {
      padding: 12px;
      border-radius: 12px;
      background: var(--chip-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dose-row-info { flex: 1; min-width: 0; }
    .dose-row-name { font-weight: 600; font-size: 14px; }
    .dose-row-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

    /* Vial progress bar */
    .vial-bar  { height: 6px; border-radius: 999px; background: var(--input-border); overflow: hidden; margin-top: 6px; }
    .vial-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

    /* Disclaimer */
    .disclaimer { font-size: 11px; color: var(--text-muted); padding: 10px 14px; text-align: center; opacity: 0.8; }

    @media (max-width: 640px) {
      .row2, .row3 { grid-template-columns: 1fr; }
      .app-title { font-size: 18px; }
    }
  </style>
</head>

  <div id="authScreen" style="display:none;"></div>
  <div id="mainApp" style="display:none;">
    <div id="app">

      <div id="vials"    class="tab-content"></div>
      <div id="calc"     class="tab-content"></div>

  <script>
// ── API Client ──────────────────────────────────────────────────────────────
const API = (() => {
  const BASE = '/api';
  const getToken = () => localStorage.getItem('peptideos_token');
  const setToken = (t) => localStorage.setItem('peptideos_token', t);
  const clearToken = () => localStorage.removeItem('peptideos_token');

  async function req(method, path, body) {
    const token = getToken();
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      }
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
    return data;
  }

  return {
    get:    (path)       => req('GET',    path),
    post:   (path, body) => req('POST',   path, body),
    put:    (path, body) => req('PUT',    path, body),
    delete: (path, body) => req('DELETE', path, body),
    setToken, clearToken, getToken
  };
})();

// ── App State ────────────────────────────────────────────────────────────────
const App = (() => {
  let _token = API.getToken();
  let _email = localStorage.getItem('peptideos_email') || '';
  let _theme = localStorage.getItem('peptideos_theme') || 'system';
  let _data  = { peptides: [], planner: [], vials: [], logs: [], settings: {} };

  function applyTheme(t) {
    _theme = t;
    localStorage.setItem('peptideos_theme', t);
    if (t === 'system') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', t);
  }

  function isLoggedIn() { return !!_token; }

  async function login(email, password) {
    const { token } = await API.post('/auth/login', { email, password });
    _token = token; _email = email;
    API.setToken(token);
    localStorage.setItem('peptideos_email', email);
  }

  async function register(email, password) {
    const { token } = await API.post('/auth/register', { email, password });
    _token = token; _email = email;
    API.setToken(token);
    localStorage.setItem('peptideos_email', email);
  }

  async function logout() {
    await API.post('/auth/logout').catch(() => {});
    API.clearToken();
    localStorage.removeItem('peptideos_email');
    _token = null; _email = '';
    _data = { peptides: [], planner: [], vials: [], logs: [], settings: {} };
  }

  async function loadAll() {
    const [peptides, planner, vials, logs, settings] = await Promise.all([
      API.get('/peptides'),
      API.get('/planner'),
      API.get('/vials'),
      API.get('/logs'),
      API.get('/settings')
    ]);
    _data = { peptides, planner, vials, logs, settings };
    applyTheme(settings.theme || 'system');
    return _data;
  }

  return {
    isLoggedIn, login, register, logout, loadAll, applyTheme,
    getData:  () => _data,
    getEmail: () => _email,
    getTheme: () => _theme
  };
})();

// ── Tab Navigation ───────────────────────────────────────────────────────────
const Tabs = (() => {
  let current = 'today';

  document.getElementById('navPill').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    switchTo(btn.dataset.tab);
  });

  function switchTo(tabId) {
    current = tabId;
    document.querySelectorAll('.nav-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tabId)
    );
    document.querySelectorAll('.tab-content').forEach(c =>
      c.classList.toggle('active', c.id === tabId)
    );
  }

  return { switchTo, current: () => current };
})();

// ── Boot ─────────────────────────────────────────────────────────────────────
(async function boot() {
  const storedTheme = localStorage.getItem('peptideos_theme') || 'system';
  if (storedTheme !== 'system') document.body.setAttribute('data-theme', storedTheme);

  if (window.location.pathname === '/reset') {
    document.getElementById('authScreen').style.display = 'flex';
    renderAuth('reset');
    return;
  }

  if (App.isLoggedIn()) {
    try {
      await App.loadAll();
      showApp();
    } catch (e) {
      if (e.status === 401) { API.clearToken(); showAuth('login'); }
      else showApp();
    }
  } else {
    showAuth('login');
  }
})();

function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  renderAllTabs();
}

function showAuth(mode) {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  renderAuth(mode);
}

function renderAllTabs() {
  renderToday();
  renderWeek();
  renderLogDose();
  renderVials();
  renderCalc();
  renderLibrary();
  renderSettings();
}

// ── Shared Helpers ────────────────────────────────────────────────────────────
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function pad2(n) { return String(n).padStart(2, '0'); }

function ymd(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function planMatched(plan, logs) {
  return logs.some(l => {
    if (l.peptide !== plan.peptide) return false;
    if (l.route   !== plan.route)   return false;
    if (l.dose_unit !== plan.unit)  return false;
    const ratio = Math.abs(parseFloat(l.dose_value) - parseFloat(plan.dose)) / (parseFloat(plan.dose) || 1);
    return ratio <= 0.02;
  });
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPass').value;
  const err   = document.getElementById('authErr');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Email and password are required.'; return; }
  try {
    await App.login(email, pass);
    await App.loadAll();
    showApp();
    renderAllTabs();
  } catch (e) {
    err.textContent = e.message || 'Login failed. Check credentials and try again.';
  }
}

async function doRegister() {
  const email   = document.getElementById('authEmail').value.trim();
  const pass    = document.getElementById('authPass').value;
  const confirm = document.getElementById('authPassConfirm').value;
  const tos     = document.getElementById('checkTos').checked;
  const disc    = document.getElementById('checkDisclaimer').checked;
  const err     = document.getElementById('authErr');
  err.textContent = '';
  if (!tos)              { err.textContent = 'You must agree to the Terms of Service and Privacy Policy.'; return; }
  if (!disc)             { err.textContent = 'You must acknowledge this app is for personal tracking only.'; return; }
  if (pass.length < 8)   { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm)  { err.textContent = 'Passwords do not match.'; return; }
  try {
    await App.register(email, pass);
    await App.loadAll();
    showApp();
    renderAllTabs();
  } catch (e) {
    err.textContent = e.message || 'Registration failed. Please try again.';
  }
}

async function doForgot() {
  const email = document.getElementById('authEmail').value.trim();
  const err   = document.getElementById('authErr');
  err.textContent = '';
  if (!email) { err.textContent = 'Please enter your email.'; return; }
  try {
    await API.post('/auth/forgot', { email });
    document.getElementById('forgotSuccess').style.display = 'block';
  } catch (e) {
    err.textContent = e.message || 'Something went wrong. Please try again.';
  }
}

async function doReset(token) {
  const pass    = document.getElementById('authPass').value;
  const confirm = document.getElementById('authPassConfirm').value;
  const err     = document.getElementById('authErr');
  err.textContent = '';
  if (pass.length < 8)  { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm) { err.textContent = 'Passwords do not match.'; return; }
  try {
    await API.post('/auth/reset', { token, password: pass });
    renderAuth('login');
  } catch (e) {
    err.textContent = e.message || 'Reset failed. The link may have expired.';
  }
}

function calcStreak(logs) {
  let streak = 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(today.getTime() - i * 86400000);
    const ds = ymd(d);
    const hasLog = logs.some(l => l.taken_at && l.taken_at.slice(0, 10) === ds);
    if (hasLog) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function calcDrawMath(vialId, doseValue, doseUnit, vials) {
  const vial = vials.find(v => v.id === vialId);
  if (!vial || !vial.mg || !vial.ml) return null;
  const conc = (parseFloat(vial.mg) * 1000) / parseFloat(vial.ml);
  if (!conc || isNaN(conc)) return null;
  let doseMcg;
  if (doseUnit === 'mcg') doseMcg = Number(doseValue);
  else if (doseUnit === 'mg') doseMcg = Number(doseValue) * 1000;
  else if (doseUnit === 'IU') {
    const volFromIU = Number(doseValue) / _syringeType;
    doseMcg = volFromIU * conc;
  }
  else return null; // 'sprays' or other non-injectable units — no draw math
  if (isNaN(doseMcg) || doseMcg <= 0) return null;
  const volMl = doseMcg / conc;
  const iu    = volMl * _syringeType;
  return { conc: conc.toFixed(1), vol: volMl.toFixed(3), iu: iu.toFixed(1), mcg: doseMcg.toFixed(1), volMl };
}

  const ldVial   = document.getElementById('ldVial');

}

async function saveLog() {
  const peptide = document.getElementById('ldPeptide').value;
  const dose    = document.getElementById('ldDose').value;
  const unit    = document.getElementById('ldUnit').value;
  const route   = document.getElementById('ldRoute').value;
  const takenAt = document.getElementById('ldTakenAt').value;
  const vialId  = document.getElementById('ldVial').value;
  const notes   = document.getElementById('ldNotes').value.trim();

  if (!peptide) { alert('Please select a peptide.'); return; }
  if (!dose || isNaN(parseFloat(dose))) { alert('Please enter a dose value.'); return; }
  if (!takenAt) { alert('Please select a date and time.'); return; }

  const { vials } = App.getData();
  const math = vialId ? calcDrawMath(vialId, dose, unit, vials) : null;

  const payload = {
    peptide, route,
    dose_value: parseFloat(dose),
    dose_unit: unit,
    taken_at: new Date(takenAt).toISOString(),
    vial_id: vialId || null,
    dose_mcg: math ? parseFloat(math.mcg) : null,
    volume_ml: math ? parseFloat(math.vol) : null,
    iu: math ? parseFloat(math.iu) : null,
    notes: notes || null
  };

  try {
    await API.post('/logs', payload);
    await App.loadAll();
    renderAllTabs();
    Tabs.switchTo('today');
  } catch (e) {
    alert('Failed to save: ' + (e.message || 'Unknown error'));
  }
}

async function deleteLastLog() {
  if (!confirm('Delete your most recent log entry?')) return;
  try {
    await API.delete('/logs/last');
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to delete: ' + (e.message || 'Unknown error'));
  }
}

// ── Task 13: Vials ─────────────────────────────────────────────────────────────
function vialRemMcg(vial, logs) {
  const totalMcg = parseFloat(vial.mg) * 1000;
  const usedMcg  = logs
    .filter(l => l.vial_id === vial.id && l.dose_mcg != null)
    .reduce((sum, l) => sum + parseFloat(l.dose_mcg), 0);
  return Math.max(0, totalMcg - usedMcg);
}

function renderVials() {
  const { peptides, vials, logs } = App.getData();
  const peptideOpts = peptides.map(p => `<option value="${escHtml(p.name)}">${escHtml(p.name)}</option>`).join('');

  let vialsHtml = '';
  if (vials.length === 0) {
    vialsHtml = '<p class="muted" style="padding:8px 0;">No vials added yet.</p>';
  } else {
    for (const vial of vials) {
      const totalMcg = parseFloat(vial.mg) * 1000;
      const remMcg   = vialRemMcg(vial, logs);
      const pct      = totalMcg > 0 ? Math.round((remMcg / totalMcg) * 100) : 0;
      const fillColor = pct > 50 ? 'var(--accent-green)' : pct > 20 ? 'var(--accent-amber)' : '#ef4444';
      const concMcgMl = totalMcg / parseFloat(vial.ml);
      vialsHtml += `
        <div style="padding:12px;border-radius:12px;background:var(--chip-bg);border:1px solid var(--glass-border);">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
            <div style="flex:1;">
              <div style="font-weight:700;">${escHtml(vial.peptide)}</div>
              <div class="muted">${vial.mg}mg / ${vial.ml}mL &middot; ${concMcgMl.toFixed(0)} mcg/mL</div>
              <div style="font-size:13px;margin-top:4px;color:${fillColor};">${remMcg.toFixed(0)} mcg remaining (${pct}%)</div>
              <div class="vial-bar"><div class="vial-fill" style="width:${pct}%;background:${fillColor};"></div></div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="deleteVial('${vial.id}')">Remove</button>
          </div>
        </div>`;
    }
  }

  document.getElementById('vials').innerHTML = `
    <div class="stack">
      <div class="glass" style="padding:20px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Add Vial</h3>
        <div class="stack">
          <div class="row3">
            <label>Peptide
              <select id="vPeptide">
                <option value="">Select…</option>
                ${peptideOpts}
              </select>
            </label>
            <label>Amount (mg)
              <input type="number" id="vMg" min="0" step="any" placeholder="e.g. 5" />
            </label>
            <label>Diluent (mL)
              <input type="number" id="vMl" min="0" step="any" placeholder="e.g. 2" />
            </label>
          </div>
          <button class="btn btn-primary" style="align-self:flex-start;" onclick="addVial()">Add Vial</button>
        </div>
      </div>
      <div class="glass" style="padding:20px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">Active Vials</h3>
        <div class="stack">${vialsHtml}</div>
      </div>
      <p class="disclaimer">For research and personal tracking purposes only. Not medical advice.</p>
    </div>`;
}

async function addVial() {
  const peptide = document.getElementById('vPeptide').value;
  const mg      = document.getElementById('vMg').value;
  const ml      = document.getElementById('vMl').value;
  if (!peptide) { alert('Please select a peptide.'); return; }
  if (!mg || parseFloat(mg) <= 0) { alert('Please enter a valid amount in mg.'); return; }
  if (!ml || parseFloat(ml) <= 0) { alert('Please enter a valid volume in mL.'); return; }
  try {
    await API.post('/vials', { peptide, mg: parseFloat(mg), ml: parseFloat(ml) });
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to add vial: ' + (e.message || 'Unknown error'));
  }
}

async function deleteVial(id) {
  if (!confirm('Remove this vial? This will unlink it from existing logs but not delete the logs.')) return;
  try {
    await API.delete('/vials/' + id);
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to remove vial: ' + (e.message || 'Unknown error'));
  }
}

// ── Task 14: Calculator ────────────────────────────────────────────────────────
let _calcSubTab = 'recon';
let _syringeType = 100;       // 100 = U-100 (standard), 40 = U-40
let _syringeCapacityMl = 1.0; // 0.3 | 0.5 | 1.0

function syringeOverflowWarning(volMl) {
  if (!volMl || volMl <= _syringeCapacityMl) return '';
  return `<div class="badge badge-pending" style="margin-top:8px;display:inline-flex;">⚠ Exceeds ${_syringeCapacityMl} mL syringe capacity</div>`;
}

function recalcActiveSyringe() {
  if (_calcSubTab === 'recon') calcRecon();
  else if (_calcSubTab === 'draw') calcDraw();
  updateDrawMath();
}

function setSyringeType(type) {
  _syringeType = type;
  const t100 = document.getElementById('syrType100');
  const t40  = document.getElementById('syrType40');
  if (t100) { t100.className = `btn btn-sm ${type === 100 ? 'btn-primary' : 'btn-ghost'}`; }
  if (t40)  { t40.className  = `btn btn-sm ${type === 40  ? 'btn-primary' : 'btn-ghost'}`; }
  const ldSel = document.getElementById('ldSyrType');
  if (ldSel) ldSel.value = String(type);
  recalcActiveSyringe();
}

function setSyringeCapacity(cap) {
  _syringeCapacityMl = cap;
  [['syrCap03', 0.3], ['syrCap05', 0.5], ['syrCap10', 1.0]].forEach(([id, val]) => {
    const btn = document.getElementById(id);
    if (btn) btn.className = `btn btn-sm ${cap === val ? 'btn-primary' : 'btn-ghost'}`;
  });
  const ldSel = document.getElementById('ldSyrCap');
  if (ldSel) ldSel.value = String(cap);
  recalcActiveSyringe();
}

  const { vials } = App.getData();

              <label>Diluent Added (mL)<input type="number" id="rDilMl" min="0" step="any" placeholder="e.g. 2" oninput="calcRecon()" /></label>

function calcRecon() {
  const mg  = parseFloat(document.getElementById('rVialMg').value);
  const ml  = parseFloat(document.getElementById('rDilMl').value);
  const res = document.getElementById('rResult');
  const drawRes = document.getElementById('rDrawResult');
  if (!mg || !ml || isNaN(mg) || isNaN(ml)) { res.style.display='none'; drawRes.style.display='none'; return; }
  const totalMcg  = mg * 1000;
  const concMcgMl = totalMcg / ml;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Concentration</div><div style="font-weight:700;">${concMcgMl.toFixed(0)} mcg/mL</div></div>
      <div><div class="muted" style="font-size:11px;">Total Amount</div><div style="font-weight:700;">${totalMcg.toFixed(0)} mcg</div></div>
    </div>`;
  const doseMcg = parseFloat(document.getElementById('rDoseMcg').value);
  if (!doseMcg || isNaN(doseMcg)) { drawRes.style.display='none'; return; }
  const volMl = doseMcg / concMcgMl;
  const iu    = volMl * _syringeType;
  drawRes.style.display = 'block';
  drawRes.innerHTML = `Draw <strong>${volMl.toFixed(3)} mL</strong> (${iu.toFixed(1)} IU on U-${_syringeType} syringe) for a ${doseMcg} mcg dose${syringeOverflowWarning(volMl)}`;
}

function calcDraw() {
  const conc = parseFloat(document.getElementById('dConc').value);
  let   dose = parseFloat(document.getElementById('dDose').value);
  const unit = document.getElementById('dUnit').value;
  const res  = document.getElementById('dResult');
  if (!conc || !dose || isNaN(conc) || isNaN(dose)) { res.style.display='none'; return; }
  if (unit === 'mg') dose *= 1000;
  const volMl = dose / conc;
  const iu    = volMl * _syringeType;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Draw Volume</div><div style="font-weight:700;color:var(--accent-sky);">${volMl.toFixed(3)} mL</div></div>
      <div><div class="muted" style="font-size:11px;">U-${_syringeType} Units</div><div style="font-weight:700;color:var(--accent-indigo);">${iu.toFixed(1)} IU</div></div>
    </div>
    ${syringeOverflowWarning(volMl)}`;
}

function calcCost() {
  const dose  = parseFloat(document.getElementById('cDose').value);
  const freq  = parseFloat(document.getElementById('cFreq').value);
  const weeks = parseFloat(document.getElementById('cWeeks').value);
  const price = parseFloat(document.getElementById('cPrice').value);
  const res   = document.getElementById('cResult');
  if (!dose||!freq||!weeks||!price||isNaN(dose)||isNaN(freq)||isNaN(weeks)||isNaN(price)) { res.style.display='none'; return; }
  const totalInj  = Math.ceil(freq * weeks);
  const totalMcg  = dose * totalInj;
  const totalMg   = totalMcg / 1000;
  const vialsNeeded = Math.ceil(totalMg / 10);
  const cost      = totalMg * price;
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">Total Injections</div><div style="font-weight:700;">${totalInj}</div></div>
      <div><div class="muted" style="font-size:11px;">Total Amount</div><div style="font-weight:700;">${totalMg.toFixed(2)} mg (${totalMcg.toFixed(0)} mcg)</div></div>
      <div><div class="muted" style="font-size:11px;">Vials Needed (10mg)</div><div style="font-weight:700;">${vialsNeeded}</div></div>
      <div><div class="muted" style="font-size:11px;">Estimated Cost</div><div style="font-weight:700;color:var(--accent-sky);">$${cost.toFixed(2)}</div></div>
    </div>`;
}

function hlFromPeptide() {
  const sel  = document.getElementById('hlPeptide');
  const name = sel.value;
  const hlNotesEl = document.getElementById('hlNotes');
  if (!name || !PEPTIDE_HALFLIFE[name]) { hlNotesEl.style.display='none'; document.getElementById('hlHours').value=''; return; }
  const data = PEPTIDE_HALFLIFE[name];
  document.getElementById('hlHours').value = data.halfLife;
  hlNotesEl.style.display = 'block';
  hlNotesEl.textContent = data.notes;
  calcHL();
}

function calcHL() {
  const hours = parseFloat(document.getElementById('hlHours').value);
  const res   = document.getElementById('hlResult');
  if (!hours || isNaN(hours) || hours <= 0) { res.style.display='none'; return; }
  const t50  = hours;
  const t25  = hours * 2;
  const t125 = hours * 3;
  function fmt(h) {
    if (h < 1) return `${(h*60).toFixed(0)} min`;
    if (h < 24) return `${h.toFixed(1)} hr`;
    return `${(h/24).toFixed(1)} days`;
  }
  res.style.display = 'block';
  res.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div><div class="muted" style="font-size:11px;">50% remaining</div><div style="font-weight:700;color:var(--accent-green);">${fmt(t50)}</div></div>
      <div><div class="muted" style="font-size:11px;">25% remaining</div><div style="font-weight:700;color:var(--accent-amber);">${fmt(t25)}</div></div>
      <div><div class="muted" style="font-size:11px;">12.5% remaining</div><div style="font-weight:700;color:#ef4444;">${fmt(t125)}</div></div>
    </div>`;
}

async function setTheme(t) {
  App.applyTheme(t);
  const { settings } = App.getData();
  await API.put('/settings', Object.assign({}, settings, { theme: t })).catch(() => {});
  renderSettings();
}

async function addPeptide() {
  const input = document.getElementById('newPeptideInput');
  const name  = input.value.trim();
  if (!name) { alert('Please enter a peptide name.'); return; }
  try {
    await API.post('/peptides', { name });
    input.value = '';
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to add peptide: ' + (e.message || 'Unknown error'));
  }
}

async function removePeptide(id, name) {
  const { planner, logs, vials } = App.getData();
  const inUse =
    planner.some(p => p.peptide === name) ||
    logs.some(l => l.peptide === name) ||
    vials.some(v => v.peptide === name);
  if (inUse) {
    alert(`"${name}" is used in your planner, logs, or vials. Remove those entries first.`);
    return;
  }
  try {
    await API.delete('/peptides/' + id);
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Failed to remove peptide: ' + (e.message || 'Unknown error'));
  }
}

async function resetPeptides() {
  if (!confirm('This will add any missing default peptides and remove unused non-default peptides. Continue?')) return;
  const { peptides, planner, logs, vials } = App.getData();
  const existingNames = peptides.map(p => p.name);
  const toAdd = DEFAULT_PEPTIDES.filter(n => !existingNames.includes(n));
  const toRemove = peptides.filter(p => {
    if (DEFAULT_PEPTIDES.includes(p.name)) return false;
    const inUse =
      planner.some(pl => pl.peptide === p.name) ||
      logs.some(l => l.peptide === p.name) ||
      vials.some(v => v.peptide === p.name);
    return !inUse;
  });
  try {
    await Promise.all(toAdd.map(n => API.post('/peptides', { name: n })));
    await Promise.all(toRemove.map(p => API.delete('/peptides/' + p.id)));
    await App.loadAll();
    renderAllTabs();
  } catch (e) {
    alert('Reset error: ' + (e.message || 'Unknown error'));
  }
}

async function saveCycleDates() {
  const start = document.getElementById('cycleStart').value;
  const end   = document.getElementById('cycleEnd').value;
  const { settings } = App.getData();
  try {
    await API.put('/settings', Object.assign({}, settings, { cycle_start: start || null, cycle_end: end || null }));
    await App.loadAll();
    renderSettings();
  } catch (e) {
    alert('Failed to save: ' + (e.message || 'Unknown error'));
  }
}

async function clearCycleDates() {
  const { settings } = App.getData();
  try {
    await API.put('/settings', Object.assign({}, settings, { cycle_start: null, cycle_end: null }));
    await App.loadAll();
    renderSettings();
  } catch (e) {
    alert('Failed to clear: ' + (e.message || 'Unknown error'));
  }
}

async function doSignOut() {
  await App.logout();
  showAuth('login');
}

function exportCSV() {
  const { planner, vials, logs, settings } = App.getData();

  const esc = (s) => {
    s = String(s ?? '');
    return (s.includes(',') || s.includes('"') || s.includes('\n'))
      ? `"${s.replaceAll('"', '""')}"` : s;
  };
  const toCsv = (rows) => {
    if (!rows.length) return '(none)';
    const keys = Object.keys(rows[0]);
    return [keys.join(','), ...rows.map(r => keys.map(k => esc(r[k])).join(','))].join('\n');
  };

  const plannerRows = planner.map(p => ({
    day: DAYS[p.day], time: p.time || '', peptide: p.peptide,
    route: p.route, dose: p.dose, unit: p.unit, note: p.note || ''
  }));

  const content = [
    `# CYCLE`,
    `cycle_start,cycle_end`,
    `${esc(settings.cycle_start || '')},${esc(settings.cycle_end || '')}`,
    '',
    `# PLANNER`,
    toCsv(plannerRows),
    '',
    `# VIALS`,
    toCsv(vials),
    '',
    `# LOGS`,
    toCsv(logs)
  ].join('\n');

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'peptideos_export.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

async function deleteAllData() {
  if (!confirm('Are you sure? This will permanently delete ALL your data including logs, vials, planner, and account.')) return;
  if (!confirm('This is irreversible. Type OK in the next prompt to confirm.')) return;
  const ok = prompt('Type DELETE to confirm permanent deletion:');
  if (ok !== 'DELETE') return;
  try {
    await API.delete('/account');
    await App.logout();
    showAuth('login');
  } catch (e) {
    alert('Failed: ' + (e.message || 'Unknown error'));
  }
}

        <label>New Password<input type="password" id="pwNew" autocomplete="new-password" placeholder="Min 8 characters" /></label>
        <label>Confirm New Password<input type="password" id="pwConfirm" autocomplete="new-password" placeholder="Repeat password" /></label>

async function submitChangePassword() {
  const currentPass = document.getElementById('cpCurrentPass').value;
  const pass        = document.getElementById('pwNew').value;
  const confirm     = document.getElementById('pwConfirm').value;
  const errEl       = document.getElementById('pwErr');
  errEl.textContent = '';
  if (!currentPass)     { errEl.textContent = 'Current password is required.'; return; }
  if (pass.length < 8)  { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== confirm)  { errEl.textContent = 'Passwords do not match.'; return; }
  try {
    await API.post('/auth/change-password', { current_password: currentPass, password: pass });
    document.getElementById('pwOverlay').remove();
    alert('Password updated successfully.');
  } catch (e) {
    errEl.textContent = e.message || 'Failed to update password.';
  }
}

function updatePushButtonState() {
  const btn    = document.getElementById('pushBtn');
  const status = document.getElementById('pushStatus');
  if (!btn || !status) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    btn.textContent = 'Not Supported';
    btn.disabled = true;
    status.textContent = 'Push notifications are not supported in this browser.';
    return;
  }
  const perm = Notification.permission;
  if (perm === 'denied') {
    btn.textContent = 'Blocked';
    btn.disabled = true;
    status.textContent = 'Notifications blocked in browser settings.';
  } else if (perm === 'granted') {
    btn.textContent = 'Disable Notifications';
    status.textContent = 'Push notifications are enabled.';
  } else {
    btn.textContent = 'Enable Notifications';
    status.textContent = 'Notifications not yet enabled.';
  }
}

function urlBase64ToUint8Array(b64) {
  const padded = b64.replace(/-/g, '+').replace(/_/g, '/');
  const padding = (4 - padded.length % 4) % 4;
  const raw = atob(padded + '='.repeat(padding));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function togglePush() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      await existing.unsubscribe();
      await API.delete('/push/subscribe', { endpoint: existing.endpoint });
      updatePushButtonState();
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { updatePushButtonState(); return; }
    const { publicKey } = await API.get('/push/vapid-key');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    const json = sub.toJSON();
    await API.post('/push/subscribe', {
      endpoint: json.endpoint,
      keys: { p256dh: json.keys.p256dh, auth: json.keys.auth }
    });
    updatePushButtonState();
  } catch (e) {
    alert('Push setup failed: ' + (e.message || 'Unknown error'));
    updatePushButtonState();
  }
}

// ── Utility ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').then(reg => {
    window.addEventListener('online', () => reg.sync?.register('flush-queue').catch(() => {}));
  }).catch(err => console.warn('SW registration failed:', err));
}
